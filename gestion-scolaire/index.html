<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة رسوم المدرسة</title>
<meta name="description" content="برنامج كامل لإدارة رسوم التسجيل والرسوم الشهرية للطلاب، متابعة المدفوعات، طباعة الإيصالات، وإعداد التقارير الشهرية.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">

<script>
try {
  var __raw = localStorage.getItem('sfm_school_fees_v1');
  var __lang = __raw ? ((JSON.parse(__raw).settings || {}).language) : null;
  if (__lang === 'fr') { document.documentElement.lang = 'fr'; document.documentElement.dir = 'ltr'; }
} catch (e) {}
</script>
<style>
:root {
  --color-primary: #1e40af;
  --color-primary-dark: #1e3a8a;
  --color-primary-light: #eff6ff;
  --color-accent: #059669;
  --color-accent-light: #ecfdf5;
  --color-warning: #d97706;
  --color-warning-light: #fffbeb;
  --color-danger: #dc2626;
  --color-danger-light: #fef2f2;
  --color-bg: #f4f6fb;
  --color-surface: #ffffff;
  --color-border: #e2e8f0;
  --color-text: #1e293b;
  --color-text-muted: #64748b;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 1px 2px rgba(15, 23, 42, .06);
  --shadow-lg: 0 10px 30px rgba(15, 23, 42, .12);
  --sidebar-w: 260px;
  --font: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--color-bg);
  color: var(--color-text);
  font-size: 15px;
  line-height: 1.6;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; }
ul { margin: 0; padding: 0; list-style: none; }
h1, h2, h3, h4 { margin: 0; }
[hidden] { display: none !important; }

/* ---------- التخطيط العام ---------- */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: linear-gradient(180deg, var(--color-primary-dark), var(--color-primary));
  color: #fff;
  display: flex;
  flex-direction: column;
  position: fixed;
  inset-inline-start: 0;
  top: 0;
  bottom: 0;
  z-index: 40;
  transition: transform .25s ease;
  --hide-x: 100%;
}
html[dir="ltr"] .sidebar { --hide-x: -100%; }
.sidebar__brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 22px 18px;
  border-bottom: 1px solid rgba(255,255,255,.15);
}
.sidebar__logo { font-size: 32px; }
.sidebar__brand strong { display: block; font-size: 16px; }
.sidebar__brand small { display: block; opacity: .75; font-size: 12px; }
.sidebar__nav { flex: 1; padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.nav-link {
  display: flex; align-items: center; gap: 10px;
  background: transparent; border: none; color: #dbeafe;
  padding: 11px 14px; border-radius: var(--radius-sm);
  cursor: pointer; text-align: start; width: 100%;
  transition: background .15s ease, color .15s ease;
}
.nav-link span { font-size: 17px; }
.nav-link:hover { background: rgba(255,255,255,.08); color: #fff; }
.nav-link.active { background: #fff; color: var(--color-primary-dark); font-weight: 700; }

.lang-switch { display: flex; gap: 6px; padding: 0 18px 14px; }
.lang-btn {
  flex: 1; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25);
  color: #dbeafe; border-radius: 999px; padding: 6px 10px; font-size: 12.5px;
  font-weight: 700; cursor: pointer; transition: background .15s ease, color .15s ease;
}
.lang-btn:hover { background: rgba(255,255,255,.18); }
.lang-btn.active { background: #fff; color: var(--color-primary-dark); }

.sidebar__footer { padding: 14px 18px; font-size: 11px; opacity: .65; border-top: 1px solid rgba(255,255,255,.15); }

.overlay-backdrop { display: none; }

.main { flex: 1; margin-inline-start: var(--sidebar-w); display: flex; flex-direction: column; min-width: 0; }

.topbar {
  display: flex; align-items: center; gap: 14px;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  padding: 14px 26px;
  position: sticky; top: 0; z-index: 20;
}
.topbar h1 { font-size: 19px; flex: 1; }
.topbar__actions { display: flex; gap: 10px; }
.icon-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--color-text); }
.only-mobile { display: none; }

.content { padding: 24px 26px 60px; flex: 1; }
.page { display: none; }
.page.active { display: block; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none; } }

/* ---------- عناصر مشتركة ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 16px; border-radius: var(--radius-sm);
  border: 1px solid transparent; cursor: pointer; font-weight: 600;
  font-size: 14px; transition: filter .15s ease, background .15s ease;
  white-space: nowrap;
}
.btn--primary { background: var(--color-primary); color: #fff; }
.btn--primary:hover { filter: brightness(1.08); }
.btn--outline { background: #fff; color: var(--color-primary); border-color: var(--color-primary); }
.btn--outline:hover { background: var(--color-primary-light); }
.btn--danger { background: var(--color-danger-light); color: var(--color-danger); }
.btn--danger:hover { background: #fee2e2; }
.btn--ghost { background: transparent; color: var(--color-text-muted); }
.btn--ghost:hover { background: #f1f5f9; }
.btn--sm { padding: 6px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card__header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--color-border); gap: 10px; flex-wrap: wrap; }
.card__header h3 { font-size: 15.5px; }
.card__body { padding: 18px 20px; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 22px; }
.stat-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.stat-card__icon { font-size: 26px; margin-bottom: 8px; display: inline-block; }
.stat-card__label { font-size: 13px; color: var(--color-text-muted); margin-bottom: 4px; }
.stat-card__value { font-size: 22px; font-weight: 800; }
.stat-card--accent { border-inline-start: 4px solid var(--color-accent); }
.stat-card--warn { border-inline-start: 4px solid var(--color-warning); }
.stat-card--danger { border-inline-start: 4px solid var(--color-danger); }
.stat-card--primary { border-inline-start: 4px solid var(--color-primary); }

.grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
@media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead th { text-align: start; padding: 10px 12px; color: var(--color-text-muted); font-weight: 700; font-size: 12.5px; border-bottom: 2px solid var(--color-border); white-space: nowrap; }
tbody td { padding: 11px 12px; border-bottom: 1px solid var(--color-border); vertical-align: middle; }
tbody tr:hover { background: #f8fafc; }
tbody tr:last-child td { border-bottom: none; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.badge--paid { background: var(--color-accent-light); color: var(--color-accent); }
.badge--partial { background: var(--color-warning-light); color: var(--color-warning); }
.badge--unpaid { background: var(--color-danger-light); color: var(--color-danger); }
.badge--muted { background: #f1f5f9; color: var(--color-text-muted); }

.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .field { min-width: 160px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12.5px; font-weight: 700; color: var(--color-text-muted); }
.field input, .field select, .field textarea {
  padding: 9px 11px; border: 1px solid var(--color-border); border-radius: var(--radius-sm);
  background: #fff; color: var(--color-text); width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--color-primary-light); border-color: var(--color-primary); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }

.empty-state { text-align: center; padding: 50px 20px; color: var(--color-text-muted); }
.empty-state__icon { font-size: 42px; margin-bottom: 10px; }

/* ---------- نافذة منبثقة ---------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15, 23, 42, .5);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 16px; overflow-y: auto; z-index: 100;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: #fff; border-radius: var(--radius); width: 100%; max-width: 560px;
  box-shadow: var(--shadow-lg); animation: pop .15s ease;
}
@keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
.modal__header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--color-border); }
.modal__header h3 { font-size: 16.5px; }
.modal__close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--color-text-muted); }
.modal__body { padding: 20px; max-height: 70vh; overflow-y: auto; }
.modal__footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--color-border); }
.modal--wide { max-width: 760px; }

.toast {
  position: fixed; bottom: 24px; inset-inline-end: 24px; background: var(--color-text);
  color: #fff; padding: 12px 20px; border-radius: var(--radius-sm); box-shadow: var(--shadow-lg);
  z-index: 200; font-size: 14px; font-weight: 600;
}
.toast.hidden { display: none; }
.toast--success { background: var(--color-accent); }
.toast--error { background: var(--color-danger); }

/* ---------- إيصال الطباعة ---------- */
#print-area { display: none; }
.receipt { padding: 30px; font-family: var(--font); max-width: 480px; margin: auto; }
.receipt h2 { text-align: center; margin-bottom: 2px; }
.receipt .sub { text-align: center; color: var(--color-text-muted); margin-bottom: 18px; }
.receipt table { width: 100%; border-collapse: collapse; margin: 16px 0; }
.receipt td { padding: 8px 4px; border-bottom: 1px dashed var(--color-border); }
.receipt .total-row td { font-weight: 800; font-size: 17px; border-bottom: none; border-top: 2px solid #000; }
.receipt .sign { display: flex; justify-content: space-between; margin-top: 50px; font-size: 13px; }

@media print {
  body * { visibility: hidden; }
  #print-area, #print-area * { visibility: visible; }
  #print-area { display: block; position: absolute; top: 0; inset-inline-start: 0; width: 100%; }
}

/* ---------- استجابة الشاشات الصغيرة ---------- */
@media (max-width: 900px) {
  .sidebar { transform: translateX(var(--hide-x, 100%)); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-inline-start: 0; }
  .only-mobile { display: inline-block; }
  .overlay-backdrop.open { display: block; position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 30; }
  .topbar__actions .btn span.label { display: none; }
}
@media (max-width: 560px) {
  .content { padding: 16px 14px 50px; }
  .topbar { padding: 12px 14px; }
  .topbar h1 { font-size: 16px; }
  .topbar__actions .btn { padding: 8px 10px; font-size: 12.5px; }
}
</style>
</head>

<div class="app">
  <!-- الشريط الجانبي -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <span class="sidebar__logo">🎓</span>
      <div>
        <strong id="brand-name">اسم المدرسة</strong>
        <small id="brand-year">السنة الدراسية</small>
      </div>
    </div>
    <nav class="sidebar__nav">
      <button class="nav-link active" data-section="dashboard"><span>📊</span> <span class="nav-label"></span></button>
      <button class="nav-link" data-section="students"><span>👨‍🎓</span> <span class="nav-label"></span></button>
      <button class="nav-link" data-section="classes"><span>🏫</span> <span class="nav-label"></span></button>

  <div class="modal" id="modal-container"></div>

<script>
'use strict';

/* =========================================================
   نظام إدارة رسوم المدرسة — تطبيق يعمل بالكامل من المتصفح
   يخزّن كل البيانات في localStorage، لا حاجة لخادم أو اتصال إنترنت.
   ========================================================= */

const STORAGE_KEY = 'sfm_school_fees_v1';
const ARABIC_MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
  'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
const FRENCH_MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin',
  'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

/* ---------------- الترجمة ---------------- */
function L(ar, fr) {
  return (state && state.settings && state.settings.language === 'fr') ? fr : ar;
}
function sortLocale() {
  return (state && state.settings && state.settings.language === 'fr') ? 'fr' : 'ar';
}

/* ---------------- أدوات مساعدة عامة ---------------- */
function uid(prefix) {
  return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function currentMonth() { return new Date().toISOString().slice(0, 7); }
function currentSchoolYear() {
  const d = new Date();
  const y = d.getFullYear();
  return d.getMonth() >= 8 ? `${y}-${y + 1}` : `${y - 1}-${y}`;
}
function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, s => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[s]));
}
function fmtMoney(n) {
  const num = Number(n) || 0;
  return num.toLocaleString('en-US') + ' ' + escapeHtml(state.settings.currency);
}
function fmtDate(d) {
  if (!d) return '—';
  const date = new Date(d + 'T00:00:00');
  if (isNaN(date)) return d;
  return date.toLocaleDateString('en-GB', { year: 'numeric', month: '2-digit', day: '2-digit' });
}
function monthLabel(m) {
  if (!m) return '—';
  const [y, mm] = m.split('-');
  const names = L(ARABIC_MONTHS, FRENCH_MONTHS);
  return `${names[parseInt(mm, 10) - 1] || mm} ${y}`;
}
function lastNMonths(n) {
  const out = [];
  const d = new Date();
  d.setDate(1);
  for (let i = 0; i < n; i++) {
    out.push(d.toISOString().slice(0, 7));
    d.setMonth(d.getMonth() - 1);
  }
  return out;
}

/* ---------------- حالة البيانات ---------------- */
function defaultState() {
  return {
    settings: {
      schoolName: 'اسم المدرسة',
      schoolYear: currentSchoolYear(),
      currency: 'FCFA',
      defaultRegistrationFee: 0,
      receiptPrefix: 'REC',
      nextReceiptNumber: 1,
      address: '',
      phone: '',
      language: 'ar'
    },
    classes: [],
    students: [],
    payments: []
  };
}

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    return {
      settings: { ...base.settings, ...(parsed.settings || {}) },
      classes: Array.isArray(parsed.classes) ? parsed.classes : [],
      students: Array.isArray(parsed.students) ? parsed.students : [],
      payments: Array.isArray(parsed.payments) ? parsed.payments : []
    };
  } catch (e) {
    console.error('تعذر تحميل البيانات المحفوظة', e);
    return defaultState();
  }
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ---------------- حسابات الرسوم ---------------- */
function getClass(id) { return state.classes.find(c => c.id === id); }
function getStudent(id) { return state.students.find(s => s.id === id); }
function className(id) { const c = getClass(id); return c ? c.name : '—'; }

function studentPayments(studentId, type) {
  return state.payments.filter(p => p.studentId === studentId && (!type || p.type === type));
}
function registrationFee(student) {
  return student.registrationFee != null ? Number(student.registrationFee) : Number(state.settings.defaultRegistrationFee) || 0;
}
function registrationPaid(student) {
  return state.payments
    .filter(p => p.studentId === student.id && (p.type === 'registration' || p.type === 'combo'))
    .reduce((s, p) => s + Number(p.type === 'combo' ? (p.registrationAmount || 0) : p.amount), 0);
}
function registrationBalance(student) {
  return Math.max(0, registrationFee(student) - registrationPaid(student));
}
function registrationStatus(student) {
  const fee = registrationFee(student);
  if (fee <= 0) return 'paid';
  const paid = registrationPaid(student);
  if (paid >= fee) return 'paid';
  if (paid > 0) return 'partial';
  return 'unpaid';
}
function monthlyFeeFor(student) {
  if (student.monthlyFeeOverride != null && student.monthlyFeeOverride !== '') return Number(student.monthlyFeeOverride);
  const cls = getClass(student.classId);
  return cls ? Number(cls.monthlyFee) || 0 : 0;
}
function paymentMonths(p) {
  if (Array.isArray(p.months) && p.months.length) return p.months;
  return p.month ? [p.month] : [];
}
function paymentAmountForMonth(p, month) {
  if (p.type !== 'monthly' && p.type !== 'combo') return 0;
  if (Array.isArray(p.months) && p.months.length) return Number((p.allocations && p.allocations[month]) || 0);
  return p.month === month ? Number(p.amount) : 0;
}
function monthPaid(student, month) {
  return state.payments
    .filter(p => p.studentId === student.id && (p.type === 'monthly' || p.type === 'combo'))
    .reduce((s, p) => s + paymentAmountForMonth(p, month), 0);
}
function addMonths(m, n) {
  const [y, mm] = m.split('-').map(Number);
  const d = new Date(y, mm - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function monthRange(start, count) {
  const out = [];
  for (let i = 0; i < count; i++) out.push(addMonths(start, i));
  return out;
}
function totalDueForMonths(student, months) {
  const fee = monthlyFeeFor(student);
  return months.reduce((s, m) => s + Math.max(0, fee - monthPaid(student, m)), 0);
}
function distributeAmountOverMonths(student, months, totalAmount) {
  const fee = monthlyFeeFor(student);
  let remaining = totalAmount;
  const allocations = {};
  months.forEach(m => {
    const due = Math.max(0, fee - monthPaid(student, m));
    const pay = Math.min(due, remaining);
    if (pay > 0) { allocations[m] = pay; remaining -= pay; }
  });
  if (remaining > 0 && months.length) {
    const last = months[months.length - 1];
    allocations[last] = (allocations[last] || 0) + remaining;
  }
  return allocations;
}
function paymentLabel(p) {
  if (p.type === 'registration') return L('رسوم تسجيل', "Frais d'inscription");
  if (p.type === 'combo') {
    const months = paymentMonths(p);
    return L(`رسوم تسجيل + رسوم شهرية (${monthLabel(months[0])})`, `Inscription + mensualité (${monthLabel(months[0])})`);
  }
  const months = paymentMonths(p);
  if (months.length <= 1) return L('رسوم شهرية — ', 'Mensualité — ') + monthLabel(months[0]);
  return L(
    `رسوم شهرية — ${monthLabel(months[0])} → ${monthLabel(months[months.length - 1])} (${months.length} أشهر)`,
    `Mensualités — ${monthLabel(months[0])} → ${monthLabel(months[months.length - 1])} (${months.length} mois)`
  );
}
function monthStatus(student, month) {
  const fee = monthlyFeeFor(student);
  if (fee <= 0) return 'paid';
  const paid = monthPaid(student, month);
  if (paid >= fee) return 'paid';
  if (paid > 0) return 'partial';
  return 'unpaid';
}
function isEnrolledInMonth(student, month) {
  const regMonth = (student.registrationDate || '').slice(0, 7);
  if (regMonth && month < regMonth) return false;
  if (student.leaveDate) {
    const leaveMonth = student.leaveDate.slice(0, 7);
    if (month > leaveMonth) return false;
  }
  return true;
}
function statusBadge(status) {
  const map = {
    paid: ['badge--paid', L('مسدد', 'Payé')],
    partial: ['badge--partial', L('جزئي', 'Partiel')],
    unpaid: ['badge--unpaid', L('غير مسدد', 'Impayé')]
  };
  const [cls, label] = map[status] || ['badge--muted', status];
  return `<span class="badge ${cls}">${label}</span>`;
}
function nextReceiptNumber() {
  const n = state.settings.nextReceiptNumber || 1;
  state.settings.nextReceiptNumber = n + 1;
  return `${state.settings.receiptPrefix || 'REC'}-${String(n).padStart(5, '0')}`;
}

function sectionTitle(key) { return L(sections[key].ar, sections[key].fr); }
function currentSectionKey() {
  const active = document.querySelector('.nav-link.active');
  return active ? active.dataset.section : 'dashboard';
}

function navigate(name) {
  Object.keys(sections).forEach(key => {
    document.getElementById('section-' + key).classList.toggle('active', key === name);
  });
  document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.dataset.section === name));
  document.getElementById('page-title').textContent = sectionTitle(name);
  sections[name].render();
  closeSidebar();
}

  sections[currentSectionKey()].render();
  renderBrand();
}

function applyLanguage(lang) {
  if (state.settings.language === lang) return;
  state.settings.language = lang;

/* ---------------- نافذة منبثقة عامة ---------------- */
function openModal(html, opts) {
  const container = document.getElementById('modal-container');
  container.className = 'modal' + (opts && opts.wide ? ' modal--wide' : '');
  container.innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
  document.getElementById('modal-container').innerHTML = '';
}
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (type ? ' toast--' + type : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.add('hidden'), 2600);
}
function confirmAction(msg, onYes) {
  openModal(`
    <div class="modal__header"><h3>${L('تأكيد', 'Confirmer')}</h3><button class="modal__close" onclick="closeModal()">✕</button></div>
    <div class="modal__body"><p>${escapeHtml(msg)}</p></div>
    <div class="modal__footer">
      <button class="btn btn--ghost" onclick="closeModal()">${L('إلغاء', 'Annuler')}</button>
      <button class="btn btn--danger" id="confirm-yes-btn">${L('تأكيد', 'Confirmer')}</button>
    </div>
  `);
  document.getElementById('confirm-yes-btn').addEventListener('click', () => { closeModal(); onYes(); });
}

function renderDashboard() {
  const el = document.getElementById('section-dashboard');
  const month = currentMonth();
  const activeStudents = state.students.filter(s => s.status !== 'inactive');

  const totalCollectedAll = state.payments.reduce((s, p) => s + Number(p.amount), 0);
  const collectedThisMonth = state.payments
    .filter(p => (p.date || '').slice(0, 7) === month)
    .reduce((s, p) => s + Number(p.amount), 0);

  const outstandingRegistration = activeStudents.reduce((s, st) => s + registrationBalance(st), 0);

  const enrolledThisMonth = activeStudents.filter(st => isEnrolledInMonth(st, month));
  const outstandingMonthly = enrolledThisMonth.reduce((s, st) => {
    const fee = monthlyFeeFor(st);
    const paid = monthPaid(st, month);
    return s + Math.max(0, fee - paid);
  }, 0);

  const unpaidThisMonthCount = enrolledThisMonth.filter(st => monthStatus(st, month) === 'unpaid').length;

  const recent = [...state.payments].sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id)).slice(0, 8);

  el.innerHTML = `

        <div class="stat-card__value">${fmtMoney(collectedThisMonth)}</div>
      </div>
      <div class="stat-card stat-card--warn">
        <span class="stat-card__icon">📌</span>
        <div class="stat-card__label">${L('متبقٍ من رسوم التسجيل', "Solde restant — inscription")}</div>
        <div class="stat-card__value">${fmtMoney(outstandingRegistration)}</div>
      </div>
      <div class="stat-card stat-card--danger">
        <span class="stat-card__icon">⏰</span>
        <div class="stat-card__label">${L('متبقٍ من الرسوم الشهرية (هذا الشهر)', 'Solde restant — mensualité (ce mois)')}</div>
        <div class="stat-card__value">${fmtMoney(outstandingMonthly)}</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card__header">
          <h3>${L('آخر الدفعات', 'Derniers paiements')}</h3>
          <button class="btn btn--outline btn--sm" data-nav="payments">${L('عرض الكل', 'Tout afficher')}</button>
        </div>
        <div class="card__body">
          ${recent.length === 0 ? emptyState('💳', L('لا توجد دفعات مسجّلة بعد', "Aucun paiement enregistré pour l'instant")) : `
          <div class="table-wrap"><table>
            <thead><tr><th>${L('الطالب', 'Élève')}</th><th>${L('النوع', 'Type')}</th><th>${L('المبلغ', 'Montant')}</th><th>${L('التاريخ', 'Date')}</th></tr></thead>
            <tbody>
              ${recent.map(p => {
                const st = getStudent(p.studentId);
                return `<tr>
                  <td>${escapeHtml(st ? st.name : L('محذوف', 'Supprimé'))}</td>
                  <td>${paymentLabel(p)}</td>
                  <td>${fmtMoney(p.amount)}</td>
                  <td>${fmtDate(p.date)}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table></div>`}
        </div>
      </div>

          <tbody>
            ${state.classes.map(c => {
              const count = state.students.filter(s => s.classId === c.id).length;
              return `<tr>
                <td><strong>${escapeHtml(c.name)}</strong></td>
                <td>${fmtMoney(c.monthlyFee)}</td>
                <td>${count}</td>
                <td class="row-actions">
                  <button class="btn btn--outline btn--sm" data-edit="${c.id}">${L('تعديل', 'Modifier')}</button>
                  <button class="btn btn--danger btn--sm" data-del="${c.id}">${L('حذف', 'Supprimer')}</button>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table></div>`}
      </div>
    </div>
  `;
  document.getElementById('add-class-btn').addEventListener('click', () => classForm());
  el.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => classForm(getClass(b.dataset.edit))));
  el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    const c = getClass(b.dataset.del);
    const count = state.students.filter(s => s.classId === c.id).length;
    const msg = count
      ? L(`هذا القسم يضم ${count} طالبًا. سيتم إلغاء ارتباطهم بالقسم. هل تريد المتابعة؟`, `Cette classe compte ${count} élève(s). Ils seront détachés de la classe. Continuer ?`)
      : L(`هل تريد حذف قسم "${c.name}"؟`, `Voulez-vous supprimer la classe « ${c.name} » ?`);
    confirmAction(msg, () => {
      state.classes = state.classes.filter(x => x.id !== c.id);
      state.students.forEach(s => { if (s.classId === c.id) s.classId = ''; });
      save(); toast(L('تم حذف القسم', 'Classe supprimée'), 'success'); renderClasses();
    });
  }));
}
function classForm(existing) {
  const isEdit = !!existing;
  openModal(`
    <div class="modal__header"><h3>${isEdit ? L('تعديل قسم دراسي', 'Modifier la classe') : L('إضافة قسم دراسي', 'Ajouter une classe')}</h3><button class="modal__close" onclick="closeModal()">✕</button></div>
    <div class="modal__body">
      <div class="field" style="margin-bottom:14px">
        <label>${L('اسم القسم *', 'Nom de la classe *')}</label>
        <input id="cf-name" value="${escapeHtml(existing ? existing.name : '')}" placeholder="${L('مثال: السنة الثالثة أ', 'Ex : CE2 A')}">
      </div>
      <div class="field">
        <label>${L('الرسم الشهري', 'Frais mensuel')} (${escapeHtml(state.settings.currency)})</label>
        <input id="cf-fee" type="number" min="0" value="${existing ? existing.monthlyFee : ''}" placeholder="0">
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--ghost" onclick="closeModal()">${L('إلغاء', 'Annuler')}</button>
      <button class="btn btn--primary" id="cf-save">${isEdit ? L('حفظ التعديلات', 'Enregistrer') : L('إضافة', 'Ajouter')}</button>
    </div>
  `);
  document.getElementById('cf-save').addEventListener('click', () => {
    const name = document.getElementById('cf-name').value.trim();
    const fee = Number(document.getElementById('cf-fee').value) || 0;
    if (!name) { toast(L('يرجى إدخال اسم القسم', 'Veuillez saisir le nom de la classe'), 'error'); return; }
    if (isEdit) {
      existing.name = name; existing.monthlyFee = fee;
    } else {
      state.classes.push({ id: uid('cls'), name, monthlyFee: fee });
    }
    save(); closeModal(); toast(L('تم الحفظ بنجاح', 'Enregistré avec succès'), 'success'); renderClasses();
  });
}

        </div>
      </div>
      ${isEdit ? `
      <div class="field">
        <label>${L('الحالة', 'Statut')}</label>
        <select id="sf-status">
          <option value="active" ${existing.status !== 'inactive' ? 'selected' : ''}>${L('نشط', 'Actif')}</option>
          <option value="inactive" ${existing.status === 'inactive' ? 'selected' : ''}>${L('غير نشط (منسحب)', 'Inactif (retiré)')}</option>
        </select>
      </div>` : ''}
    </div>
    <div class="modal__footer">
      ${isEdit ? `<button class="btn btn--danger" id="sf-delete" style="margin-inline-end:auto">${L('حذف الطالب', "Supprimer l'élève")}</button>` : ''}

    </div>
  `, { wide: true });

  document.getElementById('sf-save').addEventListener('click', () => {
    const name = document.getElementById('sf-name').value.trim();
    if (!name) { toast(L('يرجى إدخال اسم الطالب', "Veuillez saisir le nom de l'élève"), 'error'); return; }
    const data = {
      name,
      classId: document.getElementById('sf-class-id').value,
      phone: document.getElementById('sf-phone').value.trim(),
      parentName: document.getElementById('sf-parent').value.trim(),
      registrationDate: document.getElementById('sf-regdate').value || todayISO(),
      registrationFee: Number(document.getElementById('sf-regfee').value) || 0,
      monthlyFeeOverride: document.getElementById('sf-monthlyfee').value === '' ? null : Number(document.getElementById('sf-monthlyfee').value)
    };
    if (isEdit) {
      Object.assign(existing, data);
      existing.status = document.getElementById('sf-status').value;
    } else {
      state.students.push({ id: uid('stu'), status: 'active', ...data });
    }
    save(); closeModal(); toast(L('تم حفظ بيانات الطالب', "Données de l'élève enregistrées"), 'success'); refreshCurrentSection();
  });

  if (isEdit) {
    document.getElementById('sf-delete').addEventListener('click', () => {
      confirmAction(
        L(`هل تريد حذف الطالب "${existing.name}" وكل سجل دفعاته؟ لا يمكن التراجع عن هذا الإجراء.`, `Voulez-vous supprimer l'élève « ${existing.name} » et tout son historique de paiements ? Action irréversible.`),
        () => {
          state.students = state.students.filter(s => s.id !== existing.id);
          state.payments = state.payments.filter(p => p.studentId !== existing.id);
          save(); closeModal(); toast(L('تم حذف الطالب', 'Élève supprimé'), 'success'); refreshCurrentSection();
        }
      );
    });
  }
}

function familyMembers(phone) {
  if (!phone || !phone.trim()) return [];
  const p = phone.trim();
  return state.students.filter(s => (s.phone || '').trim() === p).sort((a, b) => a.name.localeCompare(b.name, sortLocale()));
}

/* ================= الفاتورة العائلية الموحّدة ================= */
function familyInvoiceModal(phone) {
  const members = familyMembers(phone);
  if (!members.length) return;
  let invoiceMonth = currentMonth();

  function render() {
    const rows = members.map(st => {
      const regBal = registrationBalance(st);
      const monBal = isEnrolledInMonth(st, invoiceMonth) ? Math.max(0, monthlyFeeFor(st) - monthPaid(st, invoiceMonth)) : 0;
      return { s: st, regBal, monBal, total: regBal + monBal };
    });
    const grandTotal = rows.reduce((sum, r) => sum + r.total, 0);
    const monthOptions = monthRange(addMonths(currentMonth(), -2), 6);

    openModal(`
      <div class="modal__header"><h3>${L('فاتورة عائلية موحّدة', 'Facture familiale groupée')}</h3><button class="modal__close" onclick="closeModal()">✕</button></div>
      <div class="modal__body">
        <p><strong>${L('ولي الأمر:', 'Tuteur :')}</strong> ${escapeHtml(members[0].parentName || '—')} &nbsp; | &nbsp; <strong>${L('الهاتف:', 'Téléphone :')}</strong> ${escapeHtml(phone)} &nbsp; | &nbsp; <strong>${L('عدد الأبناء:', "Nombre d'enfants :")}</strong> ${members.length}</p>
        <div class="field" style="margin:14px 0;max-width:220px">
          <label>${L('شهر الاستحقاق', 'Mois concerné')}</label>
          <select id="fi-month">
            ${monthOptions.map(m => `<option value="${m}" ${m === invoiceMonth ? 'selected' : ''}>${monthLabel(m)}</option>`).join('')}
          </select>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>${L('الابن/الابنة', 'Enfant')}</th><th>${L('القسم', 'Classe')}</th><th>${L('متبقي التسجيل', 'Inscription due')}</th><th>${L('متبقي الشهر', 'Mensualité due')}</th><th>${L('الإجمالي', 'Total')}</th></tr></thead>
          <tbody>
            ${rows.map(r => `<tr>
              <td>${escapeHtml(r.s.name)}</td>
              <td>${escapeHtml(className(r.s.classId))}</td>
              <td>${fmtMoney(r.regBal)}</td>
              <td>${fmtMoney(r.monBal)}</td>
              <td><strong>${fmtMoney(r.total)}</strong></td>
            </tr>`).join('')}
          </tbody>
        </table></div>
        <div style="text-align:end;margin-top:14px;font-size:18px"><strong>${L('الإجمالي المستحق:', 'Total dû :')} ${fmtMoney(grandTotal)}</strong></div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--ghost" onclick="closeModal()">${L('إغلاق', 'Fermer')}</button>
        <button class="btn btn--primary" id="fi-print">${L('🖨️ طباعة الفاتورة', '🖨️ Imprimer la facture')}</button>
      </div>
    `, { wide: true });

    document.getElementById('fi-month').addEventListener('change', e => { invoiceMonth = e.target.value; render(); });
    document.getElementById('fi-print').addEventListener('click', () => printFamilyInvoice(phone, invoiceMonth, rows, grandTotal));
  }
  render();
}

            <option value="3">${L('3 أشهر', '3 mois')}</option>
            <option value="4">${L('4 أشهر', '4 mois')}</option>
            <option value="6">${L('6 أشهر', '6 mois')}</option>

            <option value="12">${L('12 شهرًا (سنة كاملة)', '12 mois (année complète)')}</option>

          <input id="pf-amount" type="number" min="0" placeholder="0">

          <input id="pf-combo-reg" type="number" min="0" placeholder="0">
        </div>
        <div class="field">
          <label>${L('مبلغ الشهر الأول', 'Montant du 1er mois')} (${escapeHtml(state.settings.currency)})</label>
          <input id="pf-combo-month" type="number" min="0" placeholder="0">
        </div>
      </div>
      <div class="field" id="pf-combo-total-wrap" style="margin-bottom:14px" hidden>
        <small id="pf-combo-total" style="color:var(--color-text-muted)"></small>
      </div>

      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--ghost" onclick="closeModal()">${L('إلغاء', 'Annuler')}</button>
      <button class="btn btn--primary" id="pf-save">${L('تسجيل الدفعة', 'Enregistrer le paiement')}</button>
    </div>
  `);

  const typeSel = document.getElementById('pf-type');
  const monthWrap = document.getElementById('pf-month-wrap');
  const countWrap = document.getElementById('pf-count-wrap');
  const countSel = document.getElementById('pf-count');
  const countCustomWrap = document.getElementById('pf-count-custom-wrap');
  const countCustomInput = document.getElementById('pf-count-custom');
  const previewWrap = document.getElementById('pf-months-preview-wrap');
  const previewEl = document.getElementById('pf-months-preview');
  const singleAmountWrap = document.getElementById('pf-amount-single-wrap');
  const amountInput = document.getElementById('pf-amount');
  const comboAmountWrap = document.getElementById('pf-amount-combo-wrap');
  const comboTotalWrap = document.getElementById('pf-combo-total-wrap');
  const comboTotalEl = document.getElementById('pf-combo-total');
  const comboDateWrap = document.getElementById('pf-combo-date-wrap');
  const comboRegInput = document.getElementById('pf-combo-reg');
  const comboMonthInput = document.getElementById('pf-combo-month');
  const monthInput = document.getElementById('pf-month');
  const studentSel = document.getElementById('pf-student');

  function monthsCount() {
    return countSel.value === 'other' ? Math.max(1, Number(countCustomInput.value) || 1) : Number(countSel.value);
  }
  function selectedMonths() {
    return monthRange(monthInput.value || currentMonth(), monthsCount());
  }
  function updateVisibility() {
    const type = typeSel.value;
    const isMonthly = type === 'monthly';
    const isCombo = type === 'combo';
    monthWrap.style.display = (isMonthly || isCombo) ? '' : 'none';
    countWrap.style.display = isMonthly ? '' : 'none';
    previewWrap.style.display = isMonthly ? '' : 'none';
    countCustomWrap.hidden = !(isMonthly && countSel.value === 'other');
    singleAmountWrap.style.display = isCombo ? 'none' : '';
    comboAmountWrap.hidden = !isCombo;
    comboTotalWrap.hidden = !isCombo;
    comboDateWrap.hidden = !isCombo;
  }
  function refresh() {
    updateVisibility();
    const st = getStudent(studentSel.value);
    if (!st) return;
    const type = typeSel.value;
    if (type === 'registration') {
      amountInput.value = registrationBalance(st) || '';
      previewEl.textContent = '';
    } else if (type === 'combo') {
      const month = monthInput.value || currentMonth();
      comboRegInput.value = registrationBalance(st) || '';
      comboMonthInput.value = Math.max(0, monthlyFeeFor(st) - monthPaid(st, month)) || '';
      updateComboTotal();
    } else {
      const months = selectedMonths();
      amountInput.value = totalDueForMonths(st, months) || '';
      previewEl.textContent = months.length > 1
        ? `${L('سيتم تغطية:', 'Mois couverts :')} ${months.map(monthLabel).join(L('، ', ', '))}`
        : '';
    }
  }
  function updateComboTotal() {
    const total = (Number(comboRegInput.value) || 0) + (Number(comboMonthInput.value) || 0);
    comboTotalEl.textContent = `${L('الإجمالي:', 'Total :')} ${fmtMoney(total)}`;
  }
  typeSel.addEventListener('change', refresh);
  studentSel.addEventListener('change', refresh);
  monthInput.addEventListener('change', refresh);
  countSel.addEventListener('change', refresh);
  countCustomInput.addEventListener('input', refresh);
  comboRegInput.addEventListener('input', updateComboTotal);
  comboMonthInput.addEventListener('input', updateComboTotal);
  refresh();

  document.getElementById('pf-save').addEventListener('click', () => {
    const st = getStudent(studentSel.value);
    const type = typeSel.value;

    if (type === 'combo') {
      const regAmt = Number(comboRegInput.value) || 0;
      const monAmt = Number(comboMonthInput.value) || 0;
      if (regAmt <= 0 && monAmt <= 0) { toast(L('يرجى إدخال مبلغ صحيح', 'Veuillez saisir un montant valide'), 'error'); return; }
      const month = monthInput.value || currentMonth();
      const payment = {
        id: uid('pay'),
        studentId: studentSel.value,
        type: 'combo',
        registrationAmount: regAmt,
        months: [month],
        allocations: { [month]: monAmt },
        amount: regAmt + monAmt,
        date: document.getElementById('pf-combo-date').value || todayISO(),
        note: document.getElementById('pf-note').value.trim(),
        receiptNo: nextReceiptNumber()
      };
      state.payments.push(payment);
      save();
      closeModal();
      toast(L('تم تسجيل الدفعة بنجاح', 'Paiement enregistré avec succès'), 'success');
      refreshCurrentSection();
      printReceipt(payment.id, true);
      return;
    }

    const amount = Number(amountInput.value);
    if (!amount || amount <= 0) { toast(L('يرجى إدخال مبلغ صحيح', 'Veuillez saisir un montant valide'), 'error'); return; }
    const isMonthly = type === 'monthly';
    const months = isMonthly ? selectedMonths() : [];
    const payment = {
      id: uid('pay'),
      studentId: studentSel.value,
      type,
      months: isMonthly ? months : null,
      allocations: isMonthly ? distributeAmountOverMonths(st, months, amount) : null,
      amount,
      date: document.getElementById('pf-date').value || todayISO(),
      note: document.getElementById('pf-note').value.trim(),
      receiptNo: nextReceiptNumber()
    };
    state.payments.push(payment);
    save();
    closeModal();
    toast(L('تم تسجيل الدفعة بنجاح', 'Paiement enregistré avec succès'), 'success');
    refreshCurrentSection();
    printReceipt(payment.id, true);
  });
}

function renderPayments() {
  const el = document.getElementById('section-payments');
  let list = [...state.payments];
  if (paymentFilters.type) list = list.filter(p => p.type === paymentFilters.type);
  if (paymentFilters.q) {
    const q = paymentFilters.q.toLowerCase();
    list = list.filter(p => {
      const st = getStudent(p.studentId);
      return st && st.name.toLowerCase().includes(q);
    });
  }
  list.sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));

  el.innerHTML = `
    <div class="toolbar">
      <div class="field" style="flex:1;min-width:200px">
        <label>${L('بحث باسم الطالب', "Recherche par nom d'élève")}</label>
        <input id="pyf-q" value="${escapeHtml(paymentFilters.q)}" placeholder="${L('اسم الطالب', "Nom de l'élève")}">
      </div>
      <div class="field">
        <label>${L('نوع الدفعة', 'Type de paiement')}</label>
        <select id="pyf-type">
          <option value="">${L('الكل', 'Tous')}</option>
          <option value="combo" ${paymentFilters.type === 'combo' ? 'selected' : ''}>${L('تسجيل + الشهر الأول', 'Inscription + 1er mois')}</option>
          <option value="registration" ${paymentFilters.type === 'registration' ? 'selected' : ''}>${L('رسوم تسجيل', 'Inscription')}</option>
          <option value="monthly" ${paymentFilters.type === 'monthly' ? 'selected' : ''}>${L('رسوم شهرية', 'Mensualité')}</option>
        </select>
      </div>
      <button class="btn btn--primary" id="pyf-add" style="align-self:flex-end">${L('＋ تسجيل دفعة', '＋ Nouveau paiement')}</button>
    </div>
    <div class="card">
      <div class="card__body" style="padding:0">
        ${list.length === 0 ? emptyState('💳', L('لا توجد دفعات مطابقة', 'Aucun paiement correspondant')) : `
        <div class="table-wrap"><table>
          <thead><tr><th>${L('رقم الإيصال', 'N° reçu')}</th><th>${L('الطالب', 'Élève')}</th><th>${L('النوع', 'Type')}</th><th>${L('المبلغ', 'Montant')}</th><th>${L('التاريخ', 'Date')}</th><th></th></tr></thead>
          <tbody>
            ${list.map(p => {
              const st = getStudent(p.studentId);
              return `<tr>
                <td>${escapeHtml(p.receiptNo || '—')}</td>
                <td>${escapeHtml(st ? st.name : L('محذوف', 'Supprimé'))}</td>
                <td>${paymentLabel(p)}</td>
                <td>${fmtMoney(p.amount)}</td>
                <td>${fmtDate(p.date)}</td>
                <td class="row-actions">
                  <button class="btn btn--outline btn--sm" data-print="${p.id}">${L('🖨️ إيصال', '🖨️ Reçu')}</button>
                  <button class="btn btn--danger btn--sm" data-del="${p.id}">${L('حذف', 'Supprimer')}</button>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table></div>`}
      </div>
    </div>
  `;
  document.getElementById('pyf-q').addEventListener('input', e => { paymentFilters.q = e.target.value; renderPayments(); });
  document.getElementById('pyf-type').addEventListener('change', e => { paymentFilters.type = e.target.value; renderPayments(); });
  document.getElementById('pyf-add').addEventListener('click', () => paymentForm());
  el.querySelectorAll('[data-print]').forEach(b => b.addEventListener('click', () => printReceipt(b.dataset.print)));
  el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    confirmAction(L('هل تريد حذف هذه الدفعة؟ لا يمكن التراجع عن هذا الإجراء.', 'Voulez-vous supprimer ce paiement ? Action irréversible.'), () => {
      state.payments = state.payments.filter(p => p.id !== b.dataset.del);
      save(); toast(L('تم حذف الدفعة', 'Paiement supprimé'), 'success'); refreshCurrentSection();
    });

  const area = document.getElementById('print-area');
  area.innerHTML = `
    <div class="receipt">
      <h2>${escapeHtml(state.settings.schoolName)}</h2>
      <div class="sub">${escapeHtml(state.settings.address || '')} ${state.settings.phone ? ' — ' + escapeHtml(state.settings.phone) : ''}</div>

      <hr>

/* ================= التقرير الشهري ================= */
let reportMonth = currentMonth();

function renderReport() {
  const el = document.getElementById('section-report');
  const students = state.students.filter(s => s.status !== 'inactive' && isEnrolledInMonth(s, reportMonth));

  let paid = 0, partial = 0, unpaid = 0, totalCollected = 0, totalDue = 0;
  const rows = students.map(s => {
    const fee = monthlyFeeFor(s);
    const amountPaid = monthPaid(s, reportMonth);
    const status = monthStatus(s, reportMonth);
    if (status === 'paid') paid++; else if (status === 'partial') partial++; else unpaid++;
    totalCollected += amountPaid;
    totalDue += fee;
    return { s, fee, amountPaid, status };
  }).sort((a, b) => a.s.name.localeCompare(b.s.name, sortLocale()));

  const monthOptions = lastNMonths(18);

  el.innerHTML = `
    <div class="toolbar">
      <div class="field">
        <label>${L('اختر الشهر', 'Choisir le mois')}</label>
        <select id="rp-month">
          ${monthOptions.map(m => `<option value="${m}" ${m === reportMonth ? 'selected' : ''}>${monthLabel(m)}</option>`).join('')}
        </select>
      </div>
      <button class="btn btn--outline" id="rp-export">${L('⬇️ تصدير CSV', '⬇️ Exporter en CSV')}</button>
    </div>

    <div class="stat-grid">
      <div class="stat-card stat-card--accent"><div class="stat-card__label">${L('مسدد بالكامل', 'Payé intégralement')}</div><div class="stat-card__value">${paid}</div></div>
      <div class="stat-card stat-card--warn"><div class="stat-card__label">${L('سداد جزئي', 'Paiement partiel')}</div><div class="stat-card__value">${partial}</div></div>
      <div class="stat-card stat-card--danger"><div class="stat-card__label">${L('غير مسدد', 'Impayé')}</div><div class="stat-card__value">${unpaid}</div></div>
      <div class="stat-card stat-card--primary"><div class="stat-card__label">${L('المحصّل / المستحق', 'Encaissé / Dû')}</div><div class="stat-card__value">${fmtMoney(totalCollected)} / ${fmtMoney(totalDue)}</div></div>
    </div>

    <div class="card">
      <div class="card__header"><h3>${L('تفاصيل شهر', 'Détails de')} ${monthLabel(reportMonth)}</h3></div>
      <div class="card__body" style="padding:0">
        ${rows.length === 0 ? emptyState('📅', L('لا يوجد طلاب مسجّلون لهذا الشهر', 'Aucun élève inscrit pour ce mois')) : `
        <div class="table-wrap"><table>
          <thead><tr><th>${L('الطالب', 'Élève')}</th><th>${L('القسم', 'Classe')}</th><th>${L('الرسم الشهري', 'Frais mensuel')}</th><th>${L('المدفوع', 'Payé')}</th><th>${L('الحالة', 'Statut')}</th><th></th></tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td>${escapeHtml(r.s.name)}</td>
                <td>${escapeHtml(className(r.s.classId))}</td>
                <td>${fmtMoney(r.fee)}</td>
                <td>${fmtMoney(r.amountPaid)}</td>
                <td>${statusBadge(r.status)}</td>
                <td>${r.status !== 'paid' ? `<button class="btn btn--primary btn--sm" data-pay="${r.s.id}">${L('تحصيل', 'Encaisser')}</button>` : ''}</td>
              </tr>`).join('')}
          </tbody>
        </table></div>`}
      </div>
    </div>
  `;

  document.getElementById('rp-month').addEventListener('change', e => { reportMonth = e.target.value; renderReport(); });
  document.getElementById('rp-export').addEventListener('click', () => exportReportCSV(rows));
  el.querySelectorAll('[data-pay]').forEach(b => b.addEventListener('click', () => {
    const studentId = b.dataset.pay;
    paymentForm(studentId);
    setTimeout(() => {
      const typeSel = document.getElementById('pf-type');
      const monthInput = document.getElementById('pf-month');
      if (typeSel) { typeSel.value = 'monthly'; typeSel.dispatchEvent(new Event('change')); }
      if (monthInput) { monthInput.value = reportMonth; monthInput.dispatchEvent(new Event('change')); }
    }, 0);
  }));
}

function exportReportCSV(rows) {
  const header = [L('اسم الطالب', "Nom de l'élève"), L('القسم', 'Classe'), L('الرسم الشهري', 'Frais mensuel'), L('المدفوع', 'Payé'), L('الحالة', 'Statut')];
  const statusLabel = { paid: L('مسدد', 'Payé'), partial: L('جزئي', 'Partiel'), unpaid: L('غير مسدد', 'Impayé') };
  const lines = [header.join(',')];
  rows.forEach(r => {
    lines.push([r.s.name, className(r.s.classId), r.fee, r.amountPaid, statusLabel[r.status]]
      .map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
  });
  downloadFile(`${L('تقرير', 'rapport')}-${reportMonth}.csv`, '﻿' + lines.join('\n'), 'text/csv;charset=utf-8');
}

function renderBackup() {
  const el = document.getElementById('section-backup');
  el.innerHTML = `
    <div class="grid-2">
      <div class="card">
        <div class="card__header"><h3>${L('تصدير نسخة احتياطية', 'Exporter une sauvegarde')}</h3></div>

          <button class="btn btn--primary" id="bk-export">${L('⬇️ تنزيل نسخة احتياطية (JSON)', '⬇️ Télécharger la sauvegarde (JSON)')}</button>
        </div>
      </div>
      <div class="card">
        <div class="card__header"><h3>${L('استيراد نسخة احتياطية', 'Importer une sauvegarde')}</h3></div>
        <div class="card__body">
          <p style="color:var(--color-text-muted);margin-bottom:16px">${L('استيراد ملف نسخة احتياطية سابق. سيتم', "Importer un fichier de sauvegarde. Toutes les données actuelles seront")} <strong>${L('استبدال', 'remplacées')}</strong> ${L('كل البيانات الحالية.', '.')}</p>
          <input type="file" id="bk-import" accept="application/json">
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:18px">
      <div class="card__header"><h3>${L('تصدير قوائم CSV', 'Exporter des listes CSV')}</h3></div>
      <div class="card__body" style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn--outline" id="bk-export-students">${L('⬇️ قائمة الطلاب (CSV)', '⬇️ Liste des élèves (CSV)')}</button>
        <button class="btn btn--outline" id="bk-export-payments">${L('⬇️ سجل الدفعات (CSV)', '⬇️ Historique des paiements (CSV)')}</button>
      </div>
    </div>
  `;

  document.getElementById('bk-export').addEventListener('click', () => {
    downloadFile(`${L('نسخة-احتياطية', 'sauvegarde')}-${todayISO()}.json`, JSON.stringify(state, null, 2), 'application/json');
  });
  document.getElementById('bk-import').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed !== 'object') throw new Error('bad');
        confirmAction(L('سيتم استبدال كل البيانات الحالية بالبيانات المستوردة. هل تريد المتابعة؟', 'Toutes les données actuelles seront remplacées par celles importées. Continuer ?'), () => {
          state = {
            settings: { ...defaultState().settings, ...(parsed.settings || {}) },
            classes: Array.isArray(parsed.classes) ? parsed.classes : [],
            students: Array.isArray(parsed.students) ? parsed.students : [],
            payments: Array.isArray(parsed.payments) ? parsed.payments : []
          };
          save();
          toast(L('تم استيراد البيانات بنجاح', 'Données importées avec succès'), 'success');
          document.documentElement.lang = state.settings.language;
          document.documentElement.dir = state.settings.language === 'fr' ? 'ltr' : 'rtl';
          renderBrand();
          renderStaticTexts();
          refreshCurrentSection();
        });
      } catch (err) {
        toast(L('الملف غير صالح', 'Fichier invalide'), 'error');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });
  document.getElementById('bk-export-students').addEventListener('click', () => {
    const header = [L('الاسم', 'Nom'), L('القسم', 'Classe'), L('الهاتف', 'Téléphone'), L('ولي الأمر', 'Tuteur'), L('تاريخ التسجيل', "Date d'inscription"), L('رسوم التسجيل', "Frais d'inscription"), L('المدفوع', 'Payé'), L('المتبقي', 'Restant'), L('الحالة', 'Statut')];
    const statusLabel = { paid: L('مسدد', 'Payé'), partial: L('جزئي', 'Partiel'), unpaid: L('غير مسدد', 'Impayé') };
    const lines = [header.join(',')];
    state.students.forEach(s => {
      lines.push([s.name, className(s.classId), s.phone || '', s.parentName || '', s.registrationDate || '',
        registrationFee(s), registrationPaid(s), registrationBalance(s), statusLabel[registrationStatus(s)]]
        .map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
    });
    downloadFile(`${L('قائمة-الطلاب', 'liste-des-eleves')}-${todayISO()}.csv`, '﻿' + lines.join('\n'), 'text/csv;charset=utf-8');
  });
  document.getElementById('bk-export-payments').addEventListener('click', () => {
    const header = [L('رقم الإيصال', 'N° reçu'), L('الطالب', 'Élève'), L('النوع', 'Type'), L('الشهر', 'Mois'), L('المبلغ', 'Montant'), L('التاريخ', 'Date'), L('ملاحظة', 'Remarque')];
    const lines = [header.join(',')];
    state.payments.forEach(p => {
      const st = getStudent(p.studentId);
      const months = paymentMonths(p);
      const typeLabel = p.type === 'registration' ? L('تسجيل', 'Inscription') : p.type === 'combo' ? L('تسجيل + الشهر الأول', '1er mois + inscription') : L('شهرية', 'Mensualité');
      lines.push([p.receiptNo || '', st ? st.name : L('محذوف', 'Supprimé'), typeLabel,
        months.length ? months.map(monthLabel).join(' / ') : '', p.amount, p.date, p.note || '']
        .map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
    });
    downloadFile(`${L('سجل-الدفعات', 'historique-paiements')}-${todayISO()}.csv`, '﻿' + lines.join('\n'), 'text/csv;charset=utf-8');
  });
}

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-backdrop').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');

}

/* ================= تهيئة التطبيق ================= */
function init() {
  document.documentElement.lang = state.settings.language;
  document.documentElement.dir = state.settings.language === 'fr' ? 'ltr' : 'rtl';
  renderBrand();
  renderStaticTexts();

  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', () => navigate(link.dataset.section));
  });
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.addEventListener('click', () => applyLanguage(b.dataset.lang));
  });
  document.getElementById('menu-toggle').addEventListener('click', openSidebar);
  document.getElementById('sidebar-backdrop').addEventListener('click', closeSidebar);
  document.getElementById('quick-payment-btn').addEventListener('click', () => paymentForm());
  document.getElementById('quick-student-btn').addEventListener('click', () => studentForm());
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target.id === 'modal-overlay') closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });
