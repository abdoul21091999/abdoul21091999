<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة رسوم المدرسة</title>
<meta name="description" content="برنامج كامل لإدارة رسوم التسجيل والرسوم الشهرية للطلاب، متابعة المدفوعات، طباعة الإيصالات، وإعداد التقارير الشهرية.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
try {
  var __raw = localStorage.getItem('sfm_school_fees_v1');
  var __lang = __raw ? ((JSON.parse(__raw).settings || {}).language) : null;
  if (__lang === 'fr') { document.documentElement.lang = 'fr'; document.documentElement.dir = 'ltr'; }
} catch (e) {}
</script>
<style>
:root {
  --color-primary: #1e40af;
  --color-primary-dark: #1e3a8a;
  --color-primary-light: #eff6ff;
  --color-accent: #059669;
  --color-accent-light: #ecfdf5;
  --color-warning: #d97706;
  --color-warning-light: #fffbeb;
  --color-danger: #dc2626;
  --color-danger-light: #fef2f2;
  --color-bg: #f4f6fb;
  --color-surface: #ffffff;
  --color-border: #e2e8f0;
  --color-text: #1e293b;
  --color-text-muted: #64748b;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 1px 2px rgba(15, 23, 42, .06);
  --shadow-lg: 0 10px 30px rgba(15, 23, 42, .12);
  --sidebar-w: 260px;
  --font: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--color-bg);
  color: var(--color-text);
  font-size: 15px;
  line-height: 1.6;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; }
ul { margin: 0; padding: 0; list-style: none; }
h1, h2, h3, h4 { margin: 0; }
[hidden] { display: none !important; }

/* ---------- التخطيط العام ---------- */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: linear-gradient(180deg, var(--color-primary-dark), var(--color-primary));
  color: #fff;
  display: flex;
  flex-direction: column;
  position: fixed;
  inset-inline-start: 0;
  top: 0;
  bottom: 0;
  z-index: 40;
  transition: transform .25s ease;
  --hide-x: 100%;
}
html[dir="ltr"] .sidebar { --hide-x: -100%; }
.sidebar__brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 22px 18px;
  border-bottom: 1px solid rgba(255,255,255,.15);
}
.sidebar__logo { font-size: 32px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sidebar__logo img { width: 40px; height: 40px; object-fit: contain; border-radius: 8px; background: #fff; }
.logo-upload-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.logo-upload-preview {
  width: 64px; height: 64px; border-radius: 10px; border: 1px solid var(--color-border);
  background: #fff; display: flex; align-items: center; justify-content: center;
  overflow: hidden; flex-shrink: 0; font-size: 26px; color: var(--color-text-muted);
}
.logo-upload-preview img { width: 100%; height: 100%; object-fit: contain; }
.logo-upload-actions { display: flex; flex-direction: column; gap: 8px; }
.sidebar__brand strong { display: block; font-size: 16px; }
.sidebar__brand small { display: block; opacity: .75; font-size: 12px; }
.sidebar__nav { flex: 1; padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.nav-link {
  display: flex; align-items: center; gap: 10px;
  background: transparent; border: none; color: #dbeafe;
  padding: 11px 14px; border-radius: var(--radius-sm);
  cursor: pointer; text-align: start; width: 100%;
  transition: background .15s ease, color .15s ease;
}
.nav-link span { font-size: 17px; }
.nav-link:hover { background: rgba(255,255,255,.08); color: #fff; }
.nav-link.active { background: #fff; color: var(--color-primary-dark); font-weight: 700; }

.lang-switch { display: flex; gap: 6px; padding: 0 18px 14px; }
.lang-btn {
  flex: 1; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25);
  color: #dbeafe; border-radius: 999px; padding: 6px 10px; font-size: 12.5px;
  font-weight: 700; cursor: pointer; transition: background .15s ease, color .15s ease;
}
.lang-btn:hover { background: rgba(255,255,255,.18); }
.lang-btn.active { background: #fff; color: var(--color-primary-dark); }

.sidebar__footer { padding: 14px 18px; font-size: 11px; opacity: .65; border-top: 1px solid rgba(255,255,255,.15); }

.overlay-backdrop { display: none; }

.main { flex: 1; margin-inline-start: var(--sidebar-w); display: flex; flex-direction: column; min-width: 0; }

.topbar {
  display: flex; align-items: center; gap: 14px;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  padding: 14px 26px;
  position: sticky; top: 0; z-index: 20;
}
.topbar h1 { font-size: 19px; flex: 1; }
.topbar__actions { display: flex; gap: 10px; }
.icon-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--color-text); }
.only-mobile { display: none; }

.content { padding: 24px 26px 60px; flex: 1; }
.page { display: none; }
.page.active { display: block; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none; } }

/* ---------- عناصر مشتركة ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 16px; border-radius: var(--radius-sm);
  border: 1px solid transparent; cursor: pointer; font-weight: 600;
  font-size: 14px; transition: filter .15s ease, background .15s ease;
  white-space: nowrap;
}
.btn--primary { background: var(--color-primary); color: #fff; }
.btn--primary:hover { filter: brightness(1.08); }
.btn--outline { background: #fff; color: var(--color-primary); border-color: var(--color-primary); }
.btn--outline:hover { background: var(--color-primary-light); }
.btn--danger { background: var(--color-danger-light); color: var(--color-danger); }
.btn--danger:hover { background: #fee2e2; }
.btn--ghost { background: transparent; color: var(--color-text-muted); }
.btn--ghost:hover { background: #f1f5f9; }
.btn--sm { padding: 6px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card__header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--color-border); gap: 10px; flex-wrap: wrap; }
.card__header h3 { font-size: 15.5px; }
.card__body { padding: 18px 20px; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 22px; }
.stat-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.stat-card__icon { font-size: 26px; margin-bottom: 8px; display: inline-block; }
.stat-card__label { font-size: 13px; color: var(--color-text-muted); margin-bottom: 4px; }
.stat-card__value { font-size: 22px; font-weight: 800; }
.stat-card--accent { border-inline-start: 4px solid var(--color-accent); }
.stat-card--warn { border-inline-start: 4px solid var(--color-warning); }
.stat-card--danger { border-inline-start: 4px solid var(--color-danger); }
.stat-card--primary { border-inline-start: 4px solid var(--color-primary); }

.grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
@media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead th { text-align: start; padding: 10px 12px; color: var(--color-text-muted); font-weight: 700; font-size: 12.5px; border-bottom: 2px solid var(--color-border); white-space: nowrap; }
tbody td { padding: 11px 12px; border-bottom: 1px solid var(--color-border); vertical-align: middle; }
tbody tr:hover { background: #f8fafc; }
tbody tr:last-child td { border-bottom: none; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.badge--paid { background: var(--color-accent-light); color: var(--color-accent); }
.badge--partial { background: var(--color-warning-light); color: var(--color-warning); }
.badge--unpaid { background: var(--color-danger-light); color: var(--color-danger); }
.badge--muted { background: #f1f5f9; color: var(--color-text-muted); }

.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .field { min-width: 160px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12.5px; font-weight: 700; color: var(--color-text-muted); }
.field input, .field select, .field textarea {
  padding: 9px 11px; border: 1px solid var(--color-border); border-radius: var(--radius-sm);
  background: #fff; color: var(--color-text); width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--color-primary-light); border-color: var(--color-primary); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }

.empty-state { text-align: center; padding: 50px 20px; color: var(--color-text-muted); }
.empty-state__icon { font-size: 42px; margin-bottom: 10px; }

/* ---------- نافذة منبثقة ---------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15, 23, 42, .5);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 16px; overflow-y: auto; z-index: 100;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: #fff; border-radius: var(--radius); width: 100%; max-width: 560px;
  box-shadow: var(--shadow-lg); animation: pop .15s ease;
}
@keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
.modal__header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--color-border); }
.modal__header h3 { font-size: 16.5px; }
.modal__close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--color-text-muted); }
.modal__body { padding: 20px; max-height: 70vh; overflow-y: auto; }
.modal__footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--color-border); }
.modal--wide { max-width: 760px; }

.toast {
  position: fixed; bottom: 24px; inset-inline-end: 24px; background: var(--color-text);
  color: #fff; padding: 12px 20px; border-radius: var(--radius-sm); box-shadow: var(--shadow-lg);
  z-index: 200; font-size: 14px; font-weight: 600;
}
.toast.hidden { display: none; }
.toast--success { background: var(--color-accent); }
.toast--error { background: var(--color-danger); }

/* ---------- إيصال الطباعة ---------- */
#print-area { display: none; }
.receipt { padding: 30px; font-family: var(--font); max-width: 480px; margin: auto; }
.receipt h2 { text-align: center; margin-bottom: 2px; }
.receipt .sub { text-align: center; color: var(--color-text-muted); margin-bottom: 18px; }
.receipt .official-header { text-align: center; font-size: 12px; color: var(--color-text-muted); line-height: 1.5; margin-bottom: 6px; }
.receipt table { width: 100%; border-collapse: collapse; margin: 16px 0; }
.receipt td { padding: 8px 4px; border-bottom: 1px dashed var(--color-border); }
.receipt .total-row td { font-weight: 800; font-size: 17px; border-bottom: none; border-top: 2px solid #000; }
.receipt .sign { display: flex; justify-content: space-between; margin-top: 50px; font-size: 13px; }

@media print {
  body * { visibility: hidden; }
  #print-area, #print-area * { visibility: visible; }
  #print-area { display: block; position: absolute; top: 0; inset-inline-start: 0; width: 100%; }
}

/* ---------- تبويبات فرعية ---------- */
.subtabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.subtabs button { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); font-weight: 600; font-size: 13px; cursor: pointer; }
.subtabs button.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

/* ---------- الرسوم البيانية (تقييم الأداء) ---------- */
.chart-bars { display: flex; flex-direction: column; gap: 12px; direction: ltr; }
.chart-bar-row { display: flex; align-items: center; gap: 10px; cursor: default; }
.chart-bar-label { width: 150px; flex-shrink: 0; font-size: 13px; color: var(--color-text); text-align: end; direction: rtl; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chart-bar-track { flex: 1; height: 20px; background: var(--color-bg); border-radius: 4px; overflow: hidden; }
.chart-bar-fill { height: 100%; border-radius: 4px 0 0 4px; background: #2a78d6; transition: width .25s ease; }
.chart-bar-value { width: 48px; flex-shrink: 0; font-size: 13px; font-weight: 700; color: var(--color-text); font-variant-numeric: tabular-nums; }
.chart-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; font-size: 12.5px; color: var(--color-text-muted); direction: ltr; }
.chart-legend__item { display: flex; align-items: center; gap: 6px; }
.chart-legend__key { display: inline-block; width: 16px; height: 2px; border-radius: 1px; }
.chart-tooltip {
  position: fixed; z-index: 700; background: var(--color-text); color: #fff; font-size: 12.5px;
  padding: 6px 10px; border-radius: 6px; pointer-events: none; opacity: 0; transition: opacity .1s;
  max-width: 220px; line-height: 1.6;
}
.chart-tooltip.show { opacity: 1; }
.chart-tooltip strong { font-variant-numeric: tabular-nums; }

/* ---------- طباعة كشوف تحفيظ القرآن ---------- */
.sheet-print { padding: 16px; font-family: var(--font); }
.sheet-print table { width: 100%; border-collapse: collapse; font-size: 11px; }
.sheet-print th, .sheet-print td { border: 1px solid #999; padding: 4px 6px; text-align: center; }
.sheet-print th { background: #f1f1f1; }

/* ---------- استجابة الشاشات الصغيرة ---------- */
@media (max-width: 900px) {
  .sidebar { transform: translateX(var(--hide-x, 100%)); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-inline-start: 0; }
  .only-mobile { display: inline-block; }
  .overlay-backdrop.open { display: block; position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 30; }
  .topbar__actions .btn span.label { display: none; }
}
@media (max-width: 560px) {
  .content { padding: 16px 14px 50px; }
  .topbar { padding: 12px 14px; }
  .topbar h1 { font-size: 16px; }
  .topbar__actions .btn { padding: 8px 10px; font-size: 12.5px; }
}

/* ---------- بوابة الاتصال المشترك ---------- */
.connect-gate {
  position: fixed; inset: 0; background: var(--color-bg);
  z-index: 500; display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 16px; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.gate-card {
  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); padding: 26px 22px; max-width: 440px; width: 100%;
}
.gate-card h2 { font-size: 18px; margin-bottom: 8px; }
.gate-card p.help { color: var(--color-text-muted); font-size: 13.5px; margin-bottom: 16px; line-height: 1.75; }
.gate-card textarea, .gate-card input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-sm);
  margin-bottom: 12px; background: #fff; color: var(--color-text);
}
.gate-card textarea { font-family: 'Courier New', monospace; font-size: 12px; direction: ltr; text-align: left; }
.gate-card input#gate-join-code {
  font-family: inherit; font-size: 17px; text-align: center; letter-spacing: 4px; text-transform: uppercase;
}
.gate-divider { display: flex; align-items: center; gap: 10px; margin: 16px 0; color: var(--color-text-muted); font-size: 12.5px; }
.gate-divider::before, .gate-divider::after { content: ''; flex: 1; height: 1px; background: var(--color-border); }
.gate-code-display {
  text-align: center; font-size: 30px; font-weight: 800; letter-spacing: 6px;
  background: var(--color-primary-light); color: var(--color-primary);
  border-radius: var(--radius); padding: 16px; margin: 14px 0; direction: ltr;
}

/* ---------- بوابة اختيار القسم (معهد / تحفيظ) ---------- */
.mode-gate {
  position: fixed; inset: 0; background: var(--color-bg);
  z-index: 480; display: flex; align-items: center; justify-content: center;
  padding: 24px 16px; overflow-y: auto;
}
.mode-gate__inner { max-width: 740px; width: 100%; }
.mode-gate__logo { display: block; margin: 0 auto 14px; max-height: 64px; max-width: 170px; object-fit: contain; }
.mode-cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-top: 26px; }
.mode-card {
  flex: 1; min-width: 230px; max-width: 300px;
  background: var(--color-surface); border: 2px solid var(--color-border); border-radius: var(--radius);
  padding: 34px 22px; text-align: center; cursor: pointer; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  font-family: inherit;
}
.mode-card:hover, .mode-card:focus-visible { border-color: var(--color-primary); transform: translateY(-3px); box-shadow: var(--shadow-lg); outline: none; }
.mode-card__icon { font-size: 44px; line-height: 1; }
.mode-card__title { font-size: 17px; font-weight: 800; color: var(--color-text); }
.mode-card__desc { font-size: 13px; color: var(--color-text-muted); line-height: 1.7; }
</style>
</head>
<body>

<div class="connect-gate" id="connect-gate" hidden>
  <div class="gate-card" id="gate-content"></div>
</div>

<div class="mode-gate" id="mode-gate" hidden>
  <div class="mode-gate__inner" id="mode-gate-content"></div>
</div>

<div class="app" id="app-root">
  <!-- الشريط الجانبي -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <span class="sidebar__logo" id="brand-logo">🎓</span>
      <div>
        <strong id="brand-name">اسم المدرسة</strong>
        <small id="brand-year">السنة الدراسية</small>
      </div>
    </div>
    <nav class="sidebar__nav">
      <button class="nav-link active" data-section="dashboard"><span>📊</span> <span class="nav-label"></span></button>
      <button class="nav-link" data-section="students"><span>👨‍🎓</span> <span class="nav-label"></span></button>
      <button class="nav-link" data-section="classes"><span>🏫</span> <span class="nav-label"></span></button>
      <button class="nav-link" data-section="payments"><span>💳</span> <span class="nav-label"></span></button>
      <button class="nav-link" data-section="report"><span>📅</span> <span class="nav-label"></span></button>
      <button class="nav-link" data-section="expenses"><span>💸</span> <span class="nav-label"></span></button>
      <button class="nav-link" data-section="staff"><span>👥</span> <span class="nav-label"></span></button>
      <button class="nav-link" data-section="quran"><span>🕌</span> <span class="nav-label"></span></button>
      <button class="nav-link" data-section="backup"><span>🗄️</span> <span class="nav-label"></span></button>
      <button class="nav-link" data-section="settings"><span>⚙️</span> <span class="nav-label"></span></button>
    </nav>
    <button type="button" class="btn btn--outline btn--sm" id="mode-switch-btn" style="width:100%;margin:0 0 10px"></button>
    <div class="lang-switch" id="lang-switch">
      <button type="button" class="lang-btn" data-lang="ar">العربية</button>
      <button type="button" class="lang-btn" data-lang="fr">Français</button>
    </div>
    <div class="sidebar__footer" id="sidebar-footer"></div>
  </aside>

  <div class="overlay-backdrop" id="sidebar-backdrop"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menu-toggle" aria-label="القائمة">☰</button>
      <h1 id="page-title">لوحة التحكم</h1>
      <div class="topbar__actions">
        <button class="btn btn--primary" id="quick-payment-btn"></button>
        <button class="btn btn--outline" id="quick-student-btn"></button>
      </div>
    </header>

    <main class="content">

      <!-- لوحة التحكم -->
      <section id="section-dashboard" class="page active"></section>

      <!-- الطلاب -->
      <section id="section-students" class="page"></section>

      <!-- الأقسام -->
      <section id="section-classes" class="page"></section>

      <!-- الدفعات -->
      <section id="section-payments" class="page"></section>

      <!-- التقرير الشهري -->
      <section id="section-report" class="page"></section>

      <!-- المصروفات -->
      <section id="section-expenses" class="page"></section>

      <!-- الموظفون والرواتب -->
      <section id="section-staff" class="page"></section>

      <!-- تحفيظ القرآن -->
      <section id="section-quran" class="page"></section>

      <!-- النسخ الاحتياطي -->
      <section id="section-backup" class="page"></section>

      <!-- الإعدادات -->
      <section id="section-settings" class="page"></section>

    </main>
  </div>
</div>

function L(ar, fr) {
  return (state && state.settings && state.settings.language === 'fr') ? fr : ar;
}

  return (state && state.settings && state.settings.language === 'fr') ? 'fr' : 'ar';

/* ---------------- أدوات مساعدة عامة ---------------- */
function uid(prefix) {
  return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function currentMonth() { return new Date().toISOString().slice(0, 7); }
function currentSchoolYear() {
  const d = new Date();
  const y = d.getFullYear();
  return d.getMonth() >= 8 ? `${y}-${y + 1}` : `${y - 1}-${y}`;
}
function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, s => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[s]));
}
function fmtMoney(n) {
  const num = Number(n) || 0;
  return num.toLocaleString('en-US') + ' ' + escapeHtml(state.settings.currency);
}
function fmtDate(d) {
  if (!d) return '—';
  const date = new Date(d + 'T00:00:00');
  if (isNaN(date)) return d;
  return date.toLocaleDateString('en-GB', { year: 'numeric', month: '2-digit', day: '2-digit' });
}
function monthLabel(m) {
  if (!m) return '—';
  const [y, mm] = m.split('-');
  const names = L(ARABIC_MONTHS, FRENCH_MONTHS);
  return `${names[parseInt(mm, 10) - 1] || mm} ${y}`;
}
function lastNMonths(n) {
  const out = [];
  const d = new Date();
  d.setDate(1);
  for (let i = 0; i < n; i++) {
    out.push(d.toISOString().slice(0, 7));
    d.setMonth(d.getMonth() - 1);
  }
  return out;
}

function normalizeLoadedState(parsed) {

    students: Array.isArray(parsed.students) ? parsed.students : [],

  } catch (e) {

    return defaultState();
  }
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  if (fbDb && schoolCode) {
    fbDb.collection('schools').doc(schoolCode).set(state).catch(err => {

/* ---------------- الاتصال المشترك (Firebase) ---------------- */
const FIREBASE_CONFIG_KEY = 'sfm_firebase_config';
const SCHOOL_CODE_KEY = 'sfm_school_code';
const SYNC_SKIPPED_KEY = 'sfm_sync_skipped';
let fbApp = null, fbDb = null, fbUnsub = null;
let schoolCode = localStorage.getItem(SCHOOL_CODE_KEY) || '';
let gateCreatedCode = '';

function getFirebaseConfig() {
  try { return JSON.parse(localStorage.getItem(FIREBASE_CONFIG_KEY) || 'null'); }
  catch (e) { return null; }
}
function syncSkipped() { return localStorage.getItem(SYNC_SKIPPED_KEY) === '1'; }

function parseFirebaseConfigInput(raw) {
  const text = (raw || '').replace(/[‘’‛]/g, "'").replace(/[“”‟]/g, '"');
  const candidates = text.match(/\{[^{}]*\}/g) || [];
  const target = candidates.find(c => /apiKey/.test(c));
  if (!target) return null;
  const cleaned = target
    .replace(/\/\/.*$/gm, '')
    .replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g, '$1"$2":')
    .replace(/'/g, '"')
    .replace(/,(\s*[}\]])/g, '$1');
  try {
    const cfg = JSON.parse(cleaned);
    return (cfg && cfg.apiKey && cfg.projectId) ? cfg : null;
  } catch (e) { return null; }
}

function generateSchoolCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

function initFirebase() {
  const cfg = getFirebaseConfig();
  if (!cfg) return Promise.resolve(false);
  if (fbApp) return Promise.resolve(true);
  try {
    fbApp = firebase.initializeApp(cfg);
    fbDb = firebase.firestore();
    return firebase.auth().signInAnonymously().then(() => true).catch(err => {
      console.error('Firebase auth failed', err);
      toast(L('تعذّر الاتصال بقاعدة البيانات — تحقق من إعدادات Firebase', 'Échec de connexion — vérifiez la configuration Firebase'), 'error');
      fbApp = null; fbDb = null;
      return false;
    });
  } catch (e) {
    console.error('Firebase init failed', e);
    fbApp = null; fbDb = null;
    return Promise.resolve(false);
  }
}

function attachSchoolListener() {
  if (!fbDb || !schoolCode) return;
  if (fbUnsub) { fbUnsub(); fbUnsub = null; }
  fbUnsub = fbDb.collection('schools').doc(schoolCode).onSnapshot(snap => {
    if (!snap.exists) return;
    const remote = snap.data();
    if (JSON.stringify(remote) === JSON.stringify(state)) return;
    state = normalizeLoadedState(remote);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    renderBrand();
    renderStaticTexts();
    refreshCurrentSection();
  }, err => { console.error('Firestore listen error', err); });
}

function disconnectSchool() {
  if (fbUnsub) { fbUnsub(); fbUnsub = null; }
  localStorage.removeItem(SCHOOL_CODE_KEY);
  schoolCode = '';
  refreshCurrentSection();
  toast(L('تم قطع الاتصال المشترك — بياناتك الحالية محفوظة محليًا فقط الآن', 'Déconnecté — vos données restent maintenant uniquement locales'), 'success');
}

async function handleGateCreate() {
  const btn = document.getElementById('gate-create');
  btn.disabled = true;
  const ok = await initFirebase();
  if (!ok) { btn.disabled = false; return; }
  const code = generateSchoolCode();
  try {
    await fbDb.collection('schools').doc(code).set(state);
    schoolCode = code;
    localStorage.setItem(SCHOOL_CODE_KEY, code);
    attachSchoolListener();
    gateCreatedCode = code;
    renderGate();
  } catch (e) {
    console.error(e);
    toast(L('تعذّر الإنشاء — تحقق من إعدادات Firebase (قواعد الأمان والمصادقة)', 'Échec — vérifiez la configuration Firebase (règles et authentification)'), 'error');
    btn.disabled = false;
  }
}

async function handleGateJoin() {
  const input = document.getElementById('gate-join-code');
  const code = input.value.trim().toUpperCase();
  if (!code) return;
  const btn = document.getElementById('gate-join');
  btn.disabled = true;
  const ok = await initFirebase();
  if (!ok) { btn.disabled = false; return; }
  try {
    const doc = await fbDb.collection('schools').doc(code).get();
    if (!doc.exists) {
      toast(L('هذا الرمز غير موجود', "Ce code n'existe pas"), 'error');
      btn.disabled = false;
      return;
    }
    schoolCode = code;
    localStorage.setItem(SCHOOL_CODE_KEY, code);
    state = normalizeLoadedState(doc.data());
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    attachSchoolListener();
    renderBrand();
    renderStaticTexts();
    renderGate();

    console.error(e);
    toast(L('تعذّر الانضمام — تحقق من الاتصال بالإنترنت', 'Échec — vérifiez votre connexion internet'), 'error');
    btn.disabled = false;
  }
}

/* ---------------- حسابات الرسوم ---------------- */
function getClass(id) { return state.classes.find(c => c.id === id); }
function getStudent(id) { return state.students.find(s => s.id === id); }
function className(id) { const c = getClass(id); return c ? c.name : '—'; }

function studentPayments(studentId, type) {
  return state.payments.filter(p => p.studentId === studentId && (!type || p.type === type));
}
function registrationFee(student) {
  return student.registrationFee != null ? Number(student.registrationFee) : Number(state.settings.defaultRegistrationFee) || 0;
}
function registrationPaid(student) {
  return state.payments
    .filter(p => p.studentId === student.id && (p.type === 'registration' || p.type === 'combo'))
    .reduce((s, p) => s + Number(p.type === 'combo' ? (p.registrationAmount || 0) : p.amount), 0);
}
function registrationBalance(student) {
  return Math.max(0, registrationFee(student) - registrationPaid(student));
}
function registrationStatus(student) {
  const fee = registrationFee(student);
  if (fee <= 0) return 'paid';
  const paid = registrationPaid(student);
  if (paid >= fee) return 'paid';
  if (paid > 0) return 'partial';
  return 'unpaid';
}
function monthlyFeeFor(student) {
  if (student.monthlyFeeOverride != null && student.monthlyFeeOverride !== '') return Number(student.monthlyFeeOverride);
  const cls = getClass(student.classId);
  return cls ? Number(cls.monthlyFee) || 0 : 0;
}
function paymentMonths(p) {
  if (Array.isArray(p.months) && p.months.length) return p.months;
  return p.month ? [p.month] : [];
}
function paymentAmountForMonth(p, month) {
  if (p.type !== 'monthly' && p.type !== 'combo') return 0;
  if (Array.isArray(p.months) && p.months.length) return Number((p.allocations && p.allocations[month]) || 0);
  return p.month === month ? Number(p.amount) : 0;
}
function monthPaid(student, month) {
  return state.payments
    .filter(p => p.studentId === student.id && (p.type === 'monthly' || p.type === 'combo'))
    .reduce((s, p) => s + paymentAmountForMonth(p, month), 0);
}
function addMonths(m, n) {
  const [y, mm] = m.split('-').map(Number);
  const d = new Date(y, mm - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function monthRange(start, count) {
  const out = [];
  for (let i = 0; i < count; i++) out.push(addMonths(start, i));
  return out;
}
function totalDueForMonths(student, months) {
  const fee = monthlyFeeFor(student);
  return months.reduce((s, m) => s + Math.max(0, fee - monthPaid(student, m)), 0);
}
function distributeAmountOverMonths(student, months, totalAmount) {
  const fee = monthlyFeeFor(student);
  let remaining = totalAmount;
  const allocations = {};
  months.forEach(m => {
    const due = Math.max(0, fee - monthPaid(student, m));
    const pay = Math.min(due, remaining);
    if (pay > 0) { allocations[m] = pay; remaining -= pay; }
  });
  if (remaining > 0 && months.length) {
    const last = months[months.length - 1];
    allocations[last] = (allocations[last] || 0) + remaining;
  }
  return allocations;
}
function paymentLabel(p) {
  if (p.type === 'registration') return L('رسوم تسجيل', "Frais d'inscription");
  if (p.type === 'combo') {
    const months = paymentMonths(p);
    return L(`رسوم تسجيل + رسوم شهرية (${monthLabel(months[0])})`, `Inscription + mensualité (${monthLabel(months[0])})`);
  }
  const months = paymentMonths(p);
  if (months.length <= 1) return L('رسوم شهرية — ', 'Mensualité — ') + monthLabel(months[0]);
  return L(
    `رسوم شهرية — ${monthLabel(months[0])} → ${monthLabel(months[months.length - 1])} (${months.length} أشهر)`,
    `Mensualités — ${monthLabel(months[0])} → ${monthLabel(months[months.length - 1])} (${months.length} mois)`
  );
}
function monthStatus(student, month) {
  const fee = monthlyFeeFor(student);
  if (fee <= 0) return 'paid';
  const paid = monthPaid(student, month);
  if (paid >= fee) return 'paid';
  if (paid > 0) return 'partial';
  return 'unpaid';
}
function isEnrolledInMonth(student, month) {
  const regMonth = (student.registrationDate || '').slice(0, 7);
  if (regMonth && month < regMonth) return false;
  if (student.leaveDate) {
    const leaveMonth = student.leaveDate.slice(0, 7);
    if (month > leaveMonth) return false;
  }
  return true;
}
function statusBadge(status) {
  const map = {
    paid: ['badge--paid', L('مسدد', 'Payé')],
    partial: ['badge--partial', L('جزئي', 'Partiel')],
    unpaid: ['badge--unpaid', L('غير مسدد', 'Impayé')]
  };
  const [cls, label] = map[status] || ['badge--muted', status];
  return `<span class="badge ${cls}">${label}</span>`;
}
function nextReceiptNumber() {
  const n = state.settings.nextReceiptNumber || 1;
  state.settings.nextReceiptNumber = n + 1;
  return `${state.settings.receiptPrefix || 'REC'}-${String(n).padStart(5, '0')}`;
}

    .reduce((s, p) => s + Number(p.amount), 0);

function renderClasses() {
  const el = document.getElementById('section-classes');
  el.innerHTML = `
    <div class="toolbar">
      <button class="btn btn--primary" id="add-class-btn">${L('＋ إضافة قسم دراسي', '＋ Ajouter une classe')}</button>
    </div>
    <div class="card">
      <div class="card__body" style="padding:0">
        ${state.classes.length === 0 ? emptyState('🏫', L('لم تُضِف أي قسم دراسي بعد', "Aucune classe ajoutée pour l'instant")) : `
        <div class="table-wrap"><table>
          <thead><tr><th>${L('اسم القسم', 'Nom de la classe')}</th><th>${L('الرسم الشهري', 'Frais mensuel')}</th><th>${L('عدد الطلاب', "Nombre d'élèves")}</th><th></th></tr></thead>
          <tbody>
            ${state.classes.map(c => {
              const count = state.students.filter(s => s.classId === c.id).length;
              return `<tr>
                <td><strong>${escapeHtml(c.name)}</strong></td>
                <td>${fmtMoney(c.monthlyFee)}</td>
                <td>${count}</td>
                <td class="row-actions">
                  <button class="btn btn--outline btn--sm" data-edit="${c.id}">${L('تعديل', 'Modifier')}</button>
                  <button class="btn btn--danger btn--sm" data-del="${c.id}">${L('حذف', 'Supprimer')}</button>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table></div>`}
      </div>
    </div>
  `;
  document.getElementById('add-class-btn').addEventListener('click', () => classForm());
  el.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => classForm(getClass(b.dataset.edit))));
  el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    const c = getClass(b.dataset.del);
    const count = state.students.filter(s => s.classId === c.id).length;
    const msg = count
      ? L(`هذا القسم يضم ${count} طالبًا. سيتم إلغاء ارتباطهم بالقسم. هل تريد المتابعة؟`, `Cette classe compte ${count} élève(s). Ils seront détachés de la classe. Continuer ?`)
      : L(`هل تريد حذف قسم "${c.name}"؟`, `Voulez-vous supprimer la classe « ${c.name} » ?`);
    confirmAction(msg, () => {
      state.classes = state.classes.filter(x => x.id !== c.id);
      state.students.forEach(s => { if (s.classId === c.id) s.classId = ''; });
      save(); toast(L('تم حذف القسم', 'Classe supprimée'), 'success'); renderClasses();
    });
  }));
}
function classForm(existing) {
  const isEdit = !!existing;
  openModal(`
    <div class="modal__header"><h3>${isEdit ? L('تعديل قسم دراسي', 'Modifier la classe') : L('إضافة قسم دراسي', 'Ajouter une classe')}</h3><button class="modal__close" onclick="closeModal()">✕</button></div>
    <div class="modal__body">
      <div class="field" style="margin-bottom:14px">
        <label>${L('اسم القسم *', 'Nom de la classe *')}</label>
        <input id="cf-name" value="${escapeHtml(existing ? existing.name : '')}" placeholder="${L('مثال: السنة الثالثة أ', 'Ex : CE2 A')}">
      </div>
      <div class="field">
        <label>${L('الرسم الشهري', 'Frais mensuel')} (${escapeHtml(state.settings.currency)})</label>
        <input id="cf-fee" type="number" min="0" value="${existing ? existing.monthlyFee : ''}" placeholder="0">
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--ghost" onclick="closeModal()">${L('إلغاء', 'Annuler')}</button>
      <button class="btn btn--primary" id="cf-save">${isEdit ? L('حفظ التعديلات', 'Enregistrer') : L('إضافة', 'Ajouter')}</button>
    </div>
  `);
  document.getElementById('cf-save').addEventListener('click', () => {
    const name = document.getElementById('cf-name').value.trim();
    const fee = Number(document.getElementById('cf-fee').value) || 0;
    if (!name) { toast(L('يرجى إدخال اسم القسم', 'Veuillez saisir le nom de la classe'), 'error'); return; }
    if (isEdit) {
      existing.name = name; existing.monthlyFee = fee;
    } else {
      state.classes.push({ id: uid('cls'), name, monthlyFee: fee });
    }
    save(); closeModal(); toast(L('تم الحفظ بنجاح', 'Enregistré avec succès'), 'success'); renderClasses();
  });
}

/* ================= الطلاب ================= */
let studentFilters = { q: '', classId: '', status: '' };

function renderStudents() {
  const el = document.getElementById('section-students');
  const month = currentMonth();

  let list = [...state.students];
  if (studentFilters.q) {
    const q = studentFilters.q.toLowerCase();
    list = list.filter(s => (s.name || '').toLowerCase().includes(q) || (s.phone || '').includes(q));
  }
  if (studentFilters.classId) list = list.filter(s => s.classId === studentFilters.classId);
  if (studentFilters.status) list = list.filter(s => registrationStatus(s) === studentFilters.status || monthStatus(s, month) === studentFilters.status);

  list.sort((a, b) => (a.name || '').localeCompare(b.name || '', sortLocale()));

  el.innerHTML = `
    <div class="toolbar">
      <div class="field" style="flex:1;min-width:200px">
        <label>${L('بحث', 'Recherche')}</label>
        <input id="sf-q" placeholder="${L('اسم الطالب أو رقم الهاتف', "Nom de l'élève ou téléphone")}" value="${escapeHtml(studentFilters.q)}">
      </div>
      <div class="field">
        <label>${L('القسم الدراسي', 'Classe')}</label>
        <select id="sf-class">
          <option value="">${L('كل الأقسام', 'Toutes les classes')}</option>
          ${state.classes.map(c => `<option value="${c.id}" ${studentFilters.classId === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>${L('حالة السداد', 'Statut de paiement')}</label>
        <select id="sf-status">
          <option value="">${L('الكل', 'Tous')}</option>
          <option value="paid" ${studentFilters.status === 'paid' ? 'selected' : ''}>${L('مسدد', 'Payé')}</option>
          <option value="partial" ${studentFilters.status === 'partial' ? 'selected' : ''}>${L('جزئي', 'Partiel')}</option>
          <option value="unpaid" ${studentFilters.status === 'unpaid' ? 'selected' : ''}>${L('غير مسدد', 'Impayé')}</option>
        </select>
      </div>
      <button class="btn btn--primary" id="add-student-btn" style="align-self:flex-end">${L('＋ طالب جديد', '＋ Nouvel élève')}</button>
    </div>

    <div class="card">
      <div class="card__body" style="padding:0">
        ${list.length === 0 ? emptyState('👨‍🎓', L('لا يوجد طلاب مطابقون', "Aucun élève correspondant")) : `
        <div class="table-wrap"><table>
          <thead><tr>
            <th>${L('الطالب', 'Élève')}</th><th>${L('القسم', 'Classe')}</th><th>${L('الهاتف', 'Téléphone')}</th>
            <th>${L('رسوم التسجيل', 'Inscription')}</th><th>${L('الشهر الحالي', 'Ce mois')}</th><th></th>
          </tr></thead>
          <tbody>
            ${list.map(s => `
              <tr>
                <td><strong>${escapeHtml(s.name)}</strong>${s.status === 'inactive' ? ` <span class="badge badge--muted">${L('غير نشط', 'Inactif')}</span>` : ''}</td>
                <td>${escapeHtml(className(s.classId))}</td>
                <td>${escapeHtml(s.phone || '—')}</td>
                <td>${statusBadge(registrationStatus(s))}</td>
                <td>${statusBadge(monthStatus(s, month))}</td>
                <td class="row-actions">
                  <button class="btn btn--outline btn--sm" data-view="${s.id}">${L('التفاصيل', 'Détails')}</button>
                  <button class="btn btn--primary btn--sm" data-pay="${s.id}">${L('دفعة', 'Paiement')}</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table></div>`}
      </div>
    </div>
  `;

  document.getElementById('sf-q').addEventListener('input', e => { studentFilters.q = e.target.value; renderStudents(); });
  document.getElementById('sf-class').addEventListener('change', e => { studentFilters.classId = e.target.value; renderStudents(); });
  document.getElementById('sf-status').addEventListener('change', e => { studentFilters.status = e.target.value; renderStudents(); });
  document.getElementById('add-student-btn').addEventListener('click', () => studentForm());
  el.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => studentDetail(b.dataset.view)));
  el.querySelectorAll('[data-pay]').forEach(b => b.addEventListener('click', () => paymentForm(b.dataset.pay)));
}

          <label>${L('القسم الدراسي', 'Classe')}</label>
          <select id="sf-class-id">
            <option value="">${L('— بدون —', '— Aucune —')}</option>
            ${state.classes.map(c => `<option value="${c.id}" ${seed.classId === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>${L('رقم هاتف ولي الأمر', 'Téléphone du tuteur')}</label>
          <input id="sf-phone" value="${escapeHtml(seed.phone || '')}" placeholder="77 000 00 00">
        </div>
      </div>
      <div class="field-row" style="margin-bottom:14px">
        <div class="field">
          <label>${L('اسم ولي الأمر', 'Nom du tuteur')}</label>
          <input id="sf-parent" value="${escapeHtml(seed.parentName || '')}">
        </div>
        <div class="field">
          <label>${L('تاريخ التسجيل', "Date d'inscription")}</label>
          <input id="sf-regdate" type="date" value="${existing ? existing.registrationDate || todayISO() : todayISO()}">
        </div>
      </div>
      <div class="field-row" style="margin-bottom:14px">
        <div class="field">
          <label>${L('رسوم التسجيل', "Frais d'inscription")} (${escapeHtml(state.settings.currency)})</label>
          <input id="sf-regfee" type="number" min="0" value="${existing && existing.registrationFee != null ? existing.registrationFee : state.settings.defaultRegistrationFee}">
        </div>
        <div class="field">
          <label>${L('رسم شهري خاص (اختياري)', 'Frais mensuel spécifique (optionnel)')}</label>
          <input id="sf-monthlyfee" type="number" min="0" value="${existing && existing.monthlyFeeOverride != null ? existing.monthlyFeeOverride : ''}" placeholder="${L('يُستخدم رسم القسم إن ترك فارغًا', 'Frais de la classe utilisé si laissé vide')}">
        </div>
      </div>
      ${isEdit ? `
      <div class="field">
        <label>${L('الحالة', 'Statut')}</label>
        <select id="sf-status">
          <option value="active" ${existing.status !== 'inactive' ? 'selected' : ''}>${L('نشط', 'Actif')}</option>
          <option value="inactive" ${existing.status === 'inactive' ? 'selected' : ''}>${L('غير نشط (منسحب)', 'Inactif (retiré)')}</option>
        </select>
      </div>` : ''}
    </div>
    <div class="modal__footer">
      ${isEdit ? `<button class="btn btn--danger" id="sf-delete" style="margin-inline-end:auto">${L('حذف الطالب', "Supprimer l'élève")}</button>` : ''}

    </div>
  `, { wide: true });

  document.getElementById('sf-save').addEventListener('click', () => {
    const name = document.getElementById('sf-name').value.trim();
    if (!name) { toast(L('يرجى إدخال اسم الطالب', "Veuillez saisir le nom de l'élève"), 'error'); return; }

    };

          state.students = state.students.filter(s => s.id !== existing.id);
          state.payments = state.payments.filter(p => p.studentId !== existing.id);
          save(); closeModal(); toast(L('تم حذف الطالب', 'Élève supprimé'), 'success'); refreshCurrentSection();
        }
      );
    });
  }
}

function familyMembers(phone) {
  if (!phone || !phone.trim()) return [];
  const p = phone.trim();
  return state.students.filter(s => (s.phone || '').trim() === p).sort((a, b) => a.name.localeCompare(b.name, sortLocale()));
}

/* ================= الفاتورة العائلية الموحّدة ================= */
function distributeFamilyPayment(rows, month, amountPaid, note) {
  let remaining = amountPaid;
  const created = [];
  for (const r of rows) {
    if (remaining <= 0) break;
    const regAmt = Math.min(r.regBal, remaining);
    remaining -= regAmt;
    const monAmt = Math.min(r.monBal, remaining);
    remaining -= monAmt;
    if (regAmt <= 0 && monAmt <= 0) continue;
    const base = { id: uid('pay'), studentId: r.s.id, date: todayISO(), note: note || '', receiptNo: nextReceiptNumber() };
    let payment;
    if (regAmt > 0 && monAmt > 0) {
      payment = { ...base, type: 'combo', registrationAmount: regAmt, months: [month], allocations: { [month]: monAmt }, amount: regAmt + monAmt };
    } else if (regAmt > 0) {
      payment = { ...base, type: 'registration', months: null, allocations: null, amount: regAmt };
    } else {
      payment = { ...base, type: 'monthly', months: [month], allocations: { [month]: monAmt }, amount: monAmt };
    }
    state.payments.push(payment);
    created.push(payment);
  }
  return { created, remaining };
}

/* ---------------- إرسال عبر واتساب ---------------- */
function formatPhoneForWhatsApp(phone) {
  let digits = (phone || '').replace(/\D/g, '');
  if (!digits) return '';
  if (digits.startsWith('00')) digits = digits.slice(2);
  if (digits.length === 9 && !digits.startsWith('221')) digits = '221' + digits;
  return digits;
}
function sendWhatsApp(phone, text) {
  const num = formatPhoneForWhatsApp(phone);
  if (!num) { toast(L('لا يوجد رقم هاتف صالح لهذا الطالب', "Aucun numéro de téléphone valide pour cet élève"), 'error'); return; }
  window.open(`https://wa.me/${num}?text=${encodeURIComponent(text)}`, '_blank');
}

function exportReportCSV(rows) {
  const header = [L('اسم الطالب', "Nom de l'élève"), L('القسم', 'Classe'), L('الرسم الشهري', 'Frais mensuel'), L('المدفوع', 'Payé'), L('الحالة', 'Statut')];
  const statusLabel = { paid: L('مسدد', 'Payé'), partial: L('جزئي', 'Partiel'), unpaid: L('غير مسدد', 'Impayé') };
  const lines = [header.join(',')];
  rows.forEach(r => {
    lines.push([r.s.name, className(r.s.classId), r.fee, r.amountPaid, statusLabel[r.status]]
      .map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
  });
  downloadFile(`${L('تقرير', 'rapport')}-${reportMonth}.csv`, '﻿' + lines.join('\n'), 'text/csv;charset=utf-8');
}

function getStaffMember(id) { return state.staff.find(x => x.id === id); }
function salaryPaid(staff, month) {
  return state.salaryPayments.filter(p => p.staffId === staff.id && p.month === month).reduce((s, p) => s + Number(p.amount), 0);
}
function salaryBalance(staff, month) {
  return Math.max(0, (Number(staff.monthlySalary) || 0) - salaryPaid(staff, month));
}
function salaryStatus(staff, month) {
  const fee = Number(staff.monthlySalary) || 0;
  if (fee <= 0) return 'paid';
  const paid = salaryPaid(staff, month);
  if (paid >= fee) return 'paid';
  if (paid > 0) return 'partial';
  return 'unpaid';
}

function getHalaqa(id) { return state.quranHalaqat.find(h => h.id === id); }

function halaqaMemberCount(id) { return state.quranMembers.filter(m => m.halaqaId === id && m.status !== 'inactive').length; }
function getMember(id) { return state.quranMembers.find(m => m.id === id); }
function memberRoleLabel(role) {
  const map = { student: L('طالب', 'Élève'), helper: L('مساعد', 'Assistant'), khatim: L('خاتم', 'Khatim') };
  return map[role] || role;
}
function memberRoleBadgeClass(role) {
  return role === 'student' ? 'badge--paid' : role === 'khatim' ? 'badge--partial' : 'badge--muted';
}
function addDaysISO(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}
function quranWeekStart(dateStr) {
  const d = new Date((dateStr || todayISO()) + 'T00:00:00');
  const diff = (d.getDay() + 1) % 7; // أيام منذ آخر يوم سبت
  return addDaysISO(d.toISOString().slice(0, 10), -diff);
}
function quranWeekDays(weekStart) {
  return [0, 1, 2, 3, 4].map(i => addDaysISO(weekStart, i));
}

  { ar: 'السبت', fr: 'Samedi' }, { ar: 'الأحد', fr: 'Dimanche' }, { ar: 'الإثنين', fr: 'Lundi' },

function attendanceLabel(val) {
  const map = { present: L('حضور', 'Présent'), absent: L('غياب', 'Absent'), late: L('تأخر', 'Retard') };

}

              </td>
            </tr>`).join('')}
          </tbody>
        </table></div>`}
      </div>
    </div>
  `;
  document.getElementById('add-halaqa-btn').addEventListener('click', () => halaqaForm());
  el.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => halaqaForm(getHalaqa(b.dataset.edit))));
  el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    const h = getHalaqa(b.dataset.del);
    const count = halaqaMemberCount(h.id);
    const msg = count
      ? L(`هذه الحلقة تضم ${count} عضوًا. سيتم حذفهم أيضًا مع كل سجلاتهم. هل تريد المتابعة؟`, `Ce cercle compte ${count} membre(s). Ils seront supprimés avec tous leurs registres. Continuer ?`)
      : L(`هل تريد حذف حلقة "${h.name}"؟`, `Voulez-vous supprimer le cercle « ${h.name} » ?`);
    confirmAction(msg, () => {
      const memberIds = state.quranMembers.filter(m => m.halaqaId === h.id).map(m => m.id);
      state.quranHalaqat = state.quranHalaqat.filter(x => x.id !== h.id);
      state.quranMembers = state.quranMembers.filter(m => m.halaqaId !== h.id);
      state.quranWeeklyRecords = state.quranWeeklyRecords.filter(r => !memberIds.includes(r.memberId));
      state.quranKhatimRecords = state.quranKhatimRecords.filter(r => !memberIds.includes(r.memberId));
      save(); toast(L('تم حذف الحلقة', 'Cercle supprimé'), 'success'); renderQuranHalaqat();
    });
  }));
}

function weeklyRecordFilled(rec) {
  if (!rec) return false;

    if (typeof v === 'string') return true;
    return v.absent || v.d || v.j || v.m;

}

    save(); closeModal(); toast(L('تم الحفظ بنجاح', 'Enregistré avec succès'), 'success'); renderQuranWeekly();
  });
}

            <th>${L('من', 'De')}</th><th>${L('إلى', 'À')}</th><th>${L('المقدار', 'Qté')}</th>

  window.print();

function chartTooltipShow(evt, html) {
  const tip = document.getElementById('chart-tooltip');
  tip.innerHTML = html;
  tip.classList.add('show');
  const x = evt.clientX, y = evt.clientY;
  const pad = 14;
  tip.style.left = Math.min(x + pad, window.innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.max(y - tip.offsetHeight - pad, 8) + 'px';
}
function chartTooltipHide() {
  document.getElementById('chart-tooltip').classList.remove('show');
}
function quranWeekStartsBack(count) {
  const list = [];
  let w = quranWeekStart(todayISO());
  for (let i = 0; i < count; i++) { list.push(w); w = addDaysISO(w, -7); }
  return list.reverse();
}
function studentWeekStats(rec) {
  const out = { filledDays: 0, present: 0, absent: 0, possibleMarks: 0, doneMarks: 0 };
  const att = (rec && rec.attendance) || {};
  Object.values(att).forEach(v => {
    if (!v || typeof v !== 'object') return;
    out.filledDays++;
    if (v.absent) { out.absent++; return; }
    out.present++;
    out.possibleMarks += 3;
    out.doneMarks += (v.d ? 1 : 0) + (v.j ? 1 : 0) + (v.m ? 1 : 0);
  });
  return out;
}
function halaqaPerformanceStats(halaqaId, weekStarts) {
  const members = state.quranMembers.filter(m => m.halaqaId === halaqaId && m.role === 'student' && m.status !== 'inactive');
  const totals = { doneMarks: 0, possibleMarks: 0, present: 0, filledDays: 0 };
  members.forEach(m => {
    weekStarts.forEach(ws => {
      const s = studentWeekStats(getWeeklyRecord(m.id, ws));
      totals.doneMarks += s.doneMarks; totals.possibleMarks += s.possibleMarks;
      totals.present += s.present; totals.filledDays += s.filledDays;
    });
  });
  return {
    memberCount: members.length,
    completionRate: totals.possibleMarks > 0 ? Math.round((totals.doneMarks / totals.possibleMarks) * 100) : null,
    attendanceRate: totals.filledDays > 0 ? Math.round((totals.present / totals.filledDays) * 100) : null
  };
}
function studentPerformanceSeries(memberId, weekStarts) {
  return weekStarts.map(ws => {
    const s = studentWeekStats(getWeeklyRecord(memberId, ws));
    return {
      weekStart: ws,
      completionRate: s.possibleMarks > 0 ? Math.round((s.doneMarks / s.possibleMarks) * 100) : null,
      attendanceRate: s.filledDays > 0 ? Math.round((s.present / s.filledDays) * 100) : null
    };
  });
}
function buildBarChartHtml(items) {
  return `<div class="chart-bars">
    ${items.map((it, idx) => `
      <div class="chart-bar-row" data-bar="${idx}">
        <div class="chart-bar-label">${escapeHtml(it.label)}</div>
        <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${it.value == null ? 0 : it.value}%"></div></div>
        <div class="chart-bar-value">${it.value == null ? '—' : it.value + '%'}</div>
      </div>
    `).join('')}
  </div>`;
}
function buildLineChartSvg(weekLabels, series) {
  const width = 640, height = 220;
  const padL = 34, padR = 10, padT = 16, padB = 26;
  const plotW = width - padL - padR, plotH = height - padT - padB;
  const n = weekLabels.length;
  const xFor = i => padL + (n <= 1 ? plotW / 2 : (i / (n - 1)) * plotW);
  const yFor = v => padT + plotH - (v / 100) * plotH;
  let svg = `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;overflow:visible" role="img">`;
  [0, 25, 50, 75, 100].forEach(g => {
    const y = yFor(g);
    svg += `<line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}" stroke="#e1e0d9" stroke-width="1"/>`;
    svg += `<text x="${padL - 6}" y="${y + 3}" font-size="9" fill="#898781" text-anchor="end">${g}</text>`;
  });
  svg += `<line x1="${padL}" y1="${padT + plotH}" x2="${width - padR}" y2="${padT + plotH}" stroke="#c3c2b7" stroke-width="1"/>`;
  weekLabels.forEach((lbl, i) => {
    if (n > 8 && i % 2 !== 0 && i !== n - 1) return;
    svg += `<text x="${xFor(i)}" y="${height - 8}" font-size="9" fill="#898781" text-anchor="middle">${escapeXml(lbl)}</text>`;
  });
  series.forEach(s => {
    const pts = s.values.map((v, i) => v == null ? null : { x: xFor(i), y: yFor(v), v, i }).filter(Boolean);
    if (pts.length) {
      const path = pts.map((p, idx) => (idx === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
      svg += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    pts.forEach(p => {
      svg += `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${s.color}" stroke="#fff" stroke-width="2"/>`;
      svg += `<circle cx="${p.x}" cy="${p.y}" r="14" fill="transparent" data-chart-point="${s.key}:${p.i}" style="cursor:pointer"/>`;
    });
  });
  svg += `</svg>`;
  return svg;
}
function escapeXml(str) { return escapeHtml(str); }

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function bindLogoUpload(fileInputId, previewId, removeBtnId, setter) {
  document.getElementById(fileInputId).addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 300;
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        setter(canvas.toDataURL('image/png'));
        save();
        renderBrand();
        renderSettings();
        toast(L('تم تحديث الشعار', 'Logo mis à jour'), 'success');
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });
  document.getElementById(removeBtnId).addEventListener('click', () => {
    setter('');
    save();
    renderBrand();
    renderSettings();
    toast(L('تمت إزالة الشعار', 'Logo supprimé'), 'success');
  });
}

  document.getElementById('menu-toggle').addEventListener('click', openSidebar);
  document.getElementById('sidebar-backdrop').addEventListener('click', closeSidebar);
  document.getElementById('quick-payment-btn').addEventListener('click', () => paymentForm());
  document.getElementById('quick-student-btn').addEventListener('click', () => studentForm());
  document.getElementById('mode-switch-btn').addEventListener('click', switchAppMode);
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target.id === 'modal-overlay') closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  navigate('dashboard');
  renderGate();

  if (getFirebaseConfig() && schoolCode) {
    const ok = await initFirebase();
    if (ok) attachSchoolListener();
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
